# Proyecto separado para probar el login. No enlazar con Supabase remoto.
project_id = "directa-login-local"

[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 55423

[local_smtp]
enabled = true
port = 55424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8085"
additional_redirect_urls = ["http://localhost:8085/", "http://127.0.0.1:8085/", "directa://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
