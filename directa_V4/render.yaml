# Render (render.com) — publica el backend FastAPI desde GitHub con Docker, en el plan gratuito.
# En Render: New → Blueprint → elige este repositorio. Cada push a GitHub vuelve a publicar.
#
# Completa las llaves en Render → tu servicio → Environment (las mismas de backend/.env.example).
services:
  - type: web
    name: directa-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"
