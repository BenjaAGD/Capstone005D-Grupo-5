# DIRECTA — Gerencia General
#   docker compose up --build            -> backend real (necesita backend/.env) + app web
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build   -> MODO DEMO (sin llaves)
# App web:  http://localhost:8080      Backend:  http://localhost:8000
services:
  backend:
    build: ./backend
    image: directa-backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./app
      args:
        SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Falta SUPABASE_PUBLIC_URL en .env}
        SUPABASE_PUBLIC_KEY: ${SUPABASE_PUBLIC_KEY:?Falta SUPABASE_PUBLIC_KEY en .env}
    image: directa-web
    environment:
      BACKEND_URL: https://capstone005d-grupo-5.onrender.com
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
