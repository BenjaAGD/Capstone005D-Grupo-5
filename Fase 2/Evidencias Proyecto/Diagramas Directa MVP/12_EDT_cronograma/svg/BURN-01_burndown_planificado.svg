<text x="10.0" y="324.0" font-size="9.4" fill="#7F7F7F" text-anchor="start">Horas comprometidas = tareas «comprometidas» del Sprint Backlog (Anexo 4, sección 3); las tareas «si hay capacidad» no entran en el burndown. Misma escala (0 a 50 h) en los cuatro sprints.</text></svg>