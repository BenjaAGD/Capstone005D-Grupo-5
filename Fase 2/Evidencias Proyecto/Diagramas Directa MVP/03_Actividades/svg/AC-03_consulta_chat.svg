<rect x="51.0" y="210.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="196.0" y="230.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Escribe la pregunta, elige el agente</text>
<text x="196.0" y="247.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">(general o de un área) y la envía: POST</text>
<text x="196.0" y="264.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">/api/consultar-stream/</text>
<circle cx="52.0" cy="211.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="52.0" y="215.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">1</text>
<rect x="391.0" y="302.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="536.0" y="322.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Arma la consulta de búsqueda con la</text>
<text x="536.0" y="339.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">pregunta y los últimos turnos del historial</text>
<text x="536.0" y="356.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">(hasta 4, 700 caracteres)</text>
<circle cx="392.0" cy="303.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="392.0" y="307.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">2</text>
<rect x="731.0" y="394.0" width="290.0" height="49.0" rx="11" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.7"/>
<text x="876.0" y="414.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">NVIDIA NIM: calcula el embedding de la</text>
<text x="876.0" y="431.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">pregunta (2.048 dimensiones)</text>
<circle cx="732.0" cy="395.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="732.0" y="399.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">3</text>
<rect x="731.0" y="469.0" width="290.0" height="66.0" rx="11" fill="#E2EFDA" stroke="#548235" stroke-width="1.7"/>
<text x="876.0" y="489.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">rpc match_document_chunks: los 8</text>
<text x="876.0" y="506.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">fragmentos más similares del documento</text>
<text x="876.0" y="523.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">(umbral 0,05)</text>
<circle cx="732.0" cy="470.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="732.0" y="474.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">4</text>
<rect x="391.0" y="561.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="536.0" y="581.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Amplía el contexto: busca el término clave</text>
<text x="536.0" y="598.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">y suma el fragmento siguiente (hasta 10</text>
<text x="536.0" y="615.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">fragmentos)</text>
<circle cx="392.0" cy="562.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="392.0" y="566.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">5</text>
<polygon points="536.0,653.0 684.0,692.0 536.0,731.0 388.0,692.0" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.6"/>
<text x="536.0" y="688.5" text-anchor="middle" font-size="12.5" fill="#1F2A44">¿Es una pregunta general</text>
<text x="536.0" y="703.5" text-anchor="middle" font-size="12.5" fill="#1F2A44">sobre el documento?</text>
<circle cx="512.0" cy="665.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="512.0" y="669.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">6</text>
<rect x="731.0" y="667.5" width="290.0" height="49.0" rx="11" fill="#E2EFDA" stroke="#548235" stroke-width="1.7"/>
<text x="876.0" y="688.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">document_chunks → SELECT de los</text>
<text x="876.0" y="705.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">primeros 4 fragmentos (portada e índice)</text>
<circle cx="732.0" cy="668.5" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="732.0" y="672.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">7</text>
<rect x="391.0" y="757.0" width="290.0" height="49.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="536.0" y="777.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Lee los análisis guardados de todos los</text>
<text x="536.0" y="794.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">agentes del documento (tabla analisis)</text>
<circle cx="392.0" cy="758.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="392.0" y="762.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">8</text>
<polygon points="536.0,832.0 684.0,868.0 536.0,904.0 388.0,868.0" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.6"/>
<text x="536.0" y="872.0" text-anchor="middle" font-size="12.5" fill="#1F2A44">¿Hay fragmentos o análisis?</text>
<circle cx="512.0" cy="844.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="512.0" y="848.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">9</text>
<rect x="51.0" y="938.5" width="290.0" height="49.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="196.0" y="959.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">Ve «No encontré información.» y las</text>
<text x="196.0" y="976.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">fuentes vacías</text>
<circle cx="52.0" cy="939.5" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="52.0" y="943.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">10</text>
<rect x="391.0" y="930.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="536.0" y="950.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Arma el prompt estricto: reglas del agente,</text>
<text x="536.0" y="967.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">fragmentos con [Página N], análisis previos</text>
<text x="536.0" y="984.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">y reglas anti-invención</text>
<circle cx="392.0" cy="931.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="392.0" y="935.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">11</text>
<rect x="731.0" y="1022.0" width="290.0" height="66.0" rx="11" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.7"/>
<text x="876.0" y="1042.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Groq gpt-oss-120b (hasta 4 claves) y, si</text>
<text x="876.0" y="1059.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">falla, NVIDIA nemotron-3-super;</text>
<text x="876.0" y="1076.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">temperatura 0,2 y máx. 1.000 tokens</text>
<circle cx="732.0" cy="1023.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="732.0" y="1027.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">12</text>
<polygon points="536.0,1114.0 684.0,1150.0 536.0,1186.0 388.0,1150.0" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.6"/>
<text x="536.0" y="1154.0" text-anchor="middle" font-size="12.5" fill="#1F2A44">¿Respondió algún proveedor?</text>
<circle cx="512.0" cy="1126.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="512.0" y="1130.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">13</text>
<rect x="51.0" y="1220.5" width="290.0" height="49.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="196.0" y="1241.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">Ve el aviso «No se pudo obtener</text>
<text x="196.0" y="1258.0" text-anchor="middle" font-size="13.5" fill="#1F2A44">respuesta»</text>
<circle cx="52.0" cy="1221.5" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="52.0" y="1225.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">14</text>
<rect x="391.0" y="1212.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="536.0" y="1232.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Quita pedidos de página, extrae las fuentes</text>
<text x="536.0" y="1249.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">y emite la respuesta por SSE en trozos de</text>
<text x="536.0" y="1266.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">15 caracteres</text>
<circle cx="392.0" cy="1213.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="392.0" y="1217.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">15</text>
<rect x="51.0" y="1356.0" width="290.0" height="66.0" rx="11" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.7"/>
<text x="196.0" y="1376.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">Lee la respuesta con sus fuentes (página,</text>
<text x="196.0" y="1393.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">extracto y similitud) y puede agregarla al</text>
<text x="196.0" y="1410.5" text-anchor="middle" font-size="13.5" fill="#1F2A44">informe</text>
<circle cx="52.0" cy="1357.0" r="10" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
<text x="52.0" y="1361.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">16</text>
