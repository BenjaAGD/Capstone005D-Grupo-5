<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DIRECTA — Memoria Anual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>try{var q=new URLSearchParams(location.search);var t=q.get("embed")==="1"?q.get("theme"):null;if(t!=="dark"&&t!=="light")t=localStorage.getItem("directa_theme");if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --accent:#06B6D4; --accent2:#22D3EE; --accent-ink:#0E7490;
  --crit:#FF2D55; --high:#E05A5A; --med:#F4A261; --low:#50C878; --lime:#9ACD32;
  --radius:14px; --radius-sm:10px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-scale:1;
}
[data-theme="dark"]{
  --bg:#070710; --bg2:#0C0C16; --surface:#14141F; --surface2:#1B1B2A; --surface3:#232335;
  --text:#F0EEF8; --text2:#A6A6BE; --text3:#8A8AA6; --border:#26263A; --border2:#33334D;
  --accent-soft:#06B6D422; --glow:radial-gradient(ellipse at 30% 0%, #160f3a 0%, #070710 55%);
  --track:#2a2a40; --ink-on-fill:#0b0b14; color-scheme:dark;
}
[data-theme="light"]{
  --accent2:#0E7490;
  --crit:#D61F45; --high:#C94444; --med:#C77422; --low:#2E9E5B; --lime:#6E9B1F;
  --bg:#F4F6F9; --bg2:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --surface3:#EDF0F4;
  --text:#0B1220; --text2:#566072; --text3:#667085; --border:#E2E7EE; --border2:#D2D9E3;
  --accent-soft:#06B6D416; --glow:radial-gradient(ellipse at 30% 0%, #E6FBFF 0%, #F4F6F9 55%);
  --track:#E1E6EE; --ink-on-fill:#ffffff; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:calc(13px * var(--font-scale));line-height:1.45;min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:var(--accent2);}
[data-theme="light"] a{color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#062b31;padding:8px 14px;border-radius:8px;z-index:100;font-weight:600;}
.skip:focus{left:12px;}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;min-height:60px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:8px 0;}
.brand .iso{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand .iso svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand b{letter-spacing:3px;font-size:calc(15px * var(--font-scale));}
.brand small{display:block;font-size:calc(9px * var(--font-scale));color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;line-height:1.1;}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:8px;}
.nav a{padding:8px 13px;border-radius:9px;color:var(--text2);text-decoration:none;font-weight:500;font-size:calc(13px * var(--font-scale));}
.nav a:hover{background:var(--surface2);color:var(--text);}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent2);}
[data-theme="light"] .nav a[aria-current="page"]{color:var(--accent-ink);}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;}
.tb{min-width:36px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:calc(12.5px * var(--font-scale));}
.tb:hover{color:var(--text);border-color:var(--border2);}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

main{background:var(--glow);min-height:calc(100vh - 60px);}
.embed main{min-height:100vh;}
.embed .top{display:none;}
.wrap{max-width:1120px;margin:0 auto;padding:16px 20px 40px;}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;}
.head h1{margin:0;font-size:calc(20px * var(--font-scale));font-weight:600;letter-spacing:-.3px;}
.head p{margin:2px 0 0;color:var(--text2);max-width:70ch;font-size:calc(12.5px * var(--font-scale));}
.filters{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
.filters label{font-size:calc(12px * var(--font-scale));color:var(--text3);display:flex;flex-direction:column;gap:3px;font-weight:500;}
.field{min-height:32px;padding:4px 10px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--text);max-width:100%;}
select.field{padding-right:28px;}
textarea.field{width:100%;min-height:150px;resize:vertical;line-height:1.55;}
input.field.sm{min-height:32px;padding:4px 9px;width:100%;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;font-weight:600;background:var(--accent);color:#062b31;min-height:32px;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn.sm{padding:4px 10px;min-height:28px;font-size:calc(12px * var(--font-scale));}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.card + .card, .card + section, section + .card{margin-top:12px;}
.sec{margin-top:18px;}
.sec > h2{margin:0 0 2px;font-size:calc(15px * var(--font-scale));font-weight:600;}
.sec > .sub{margin:0 0 8px;color:var(--text2);font-size:calc(12px * var(--font-scale));}
.eyebrow{font-size:calc(11px * var(--font-scale));color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin:0 0 8px;}
.muted{color:var(--text2);} .faint{color:var(--text3);}
.grid{display:grid;gap:10px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:calc(11px * var(--font-scale));font-weight:700;letter-spacing:.4px;white-space:nowrap;border:1px solid transparent;}
.glyph{width:9px;height:9px;display:inline-block;flex-shrink:0;}
.g-crit{background:var(--crit);transform:rotate(45deg);} .g-high{background:var(--high);clip-path:polygon(50% 0,100% 100%,0 100%);} .g-med{background:var(--med);border-radius:50%;} .g-low{background:transparent;border:2px solid var(--low);border-radius:50%;}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent);}
.pill.high{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent);}
.pill.med{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent);}
.pill.low{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);}
.pill.neutral{color:var(--text2);background:var(--surface3);}
.tag{font-size:calc(10.5px * var(--font-scale));color:var(--text3);border:1px solid var(--border2);border-radius:6px;padding:0 6px;white-space:nowrap;}

/* tablas */
.tbl-wrap{overflow-x:auto;}
table.t{width:100%;border-collapse:collapse;}
.t th{font-size:calc(11px * var(--font-scale));color:var(--text3);letter-spacing:1px;text-transform:uppercase;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.t td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.t tr:last-child td{border-bottom:none;}
.t .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

/* medidores y barras */
.meter{height:10px;border-radius:5px;background:var(--track);position:relative;overflow:hidden;min-width:90px;}
.meter > i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;}
.stack{display:flex;gap:2px;height:14px;min-width:110px;}
.stack > i{display:block;height:100%;border-radius:3px;min-width:6px;}
.stack.empty{background:var(--track);border-radius:3px;opacity:.5;}
.band-ok{background:var(--low);} .band-leve{background:var(--lime);} .band-revision{background:var(--med);} .band-serio{background:var(--high);} .band-critico{background:var(--crit);}
.band-sin_analizar,.band-sin_info,.band-sin_datos{background:var(--border2);}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface3);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:calc(12.5px * var(--font-scale));max-width:320px;box-shadow:0 8px 28px #0006;white-space:pre-line;opacity:0;transition:opacity .08s;}
#tip.on{opacity:1;}
#tip b{font-weight:700;}
[data-tip]{cursor:default;}

.aviso{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);margin-bottom:10px;font-size:calc(12.5px * var(--font-scale));}
.aviso.warn{border-color:var(--med);background:color-mix(in srgb,var(--med) 10%,transparent);}
.aviso.err{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);}
.aviso b{color:var(--text);}
.empty{text-align:center;padding:28px 16px;color:var(--text2);}
.empty h3{margin:0 0 6px;color:var(--text);}
.loading{opacity:.55;transition:opacity .15s;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);padding:10px 18px;border-radius:12px;z-index:70;box-shadow:0 8px 28px #0006;}

@media (max-width:760px){
  .wrap{padding:12px 12px 40px;} .top{padding:0 16px;} .nav{order:3;width:100%;margin:0 0 8px;}
  .head h1{font-size:calc(18px * var(--font-scale));}
}
@media print{
  .top,.filters,.no-print,#tip,.toast{display:none !important;}
  body{background:#fff;color:#000;} main{background:none;} .card{break-inside:avoid;border-color:#ccc;}
  [data-theme="dark"]{--bg:#fff;--surface:#fff;--surface2:#f5f5f5;--surface3:#eee;--text:#000;--text2:#333;--text3:#555;--border:#ddd;--border2:#ccc;--track:#e5e5e5;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

.kp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;display:flex;flex-direction:column;gap:3px;}
.kpi .l{font-size:calc(11.5px * var(--font-scale));color:var(--text2);}
.kpi .v{font-size:calc(20px * var(--font-scale));font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:calc(14px * var(--font-scale));color:var(--text3);font-weight:500;}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start;}
.caps{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:2px;}
.cap{display:grid;grid-template-columns:24px 1fr;gap:2px 8px;text-align:left;padding:7px 9px;border-radius:10px;border:1px solid var(--border);background:var(--surface);width:100%;}
.cap:hover{border-color:var(--border2);background:var(--surface2);}
.cap[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);}
.cap .nr{grid-row:1 / span 3;width:24px;height:24px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:calc(12.5px * var(--font-scale));color:var(--text2);}
.cap[aria-current="true"] .nr{background:var(--accent);color:#062b31;}
.cap b{font-size:calc(12.5px * var(--font-scale));line-height:1.3;}
.cap .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(11.5px * var(--font-scale));color:var(--text2);}
.cap .meter{height:6px;min-width:0;}
.est-pend{color:var(--text2);background:var(--surface3);} .est-curso{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent);} .est-listo{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);}
.det-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px;}
.det-head h2{margin:0;font-size:calc(17px * var(--font-scale));}
.sugcard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px 14px;margin:0 0 10px;}
.sugtxt p{margin:0 0 8px;line-height:1.55;} .sugpend{margin:4px 0 0;padding-left:18px;font-size:calc(13px * var(--font-scale));} .sugpend li{margin:2px 0;}
.tema{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--border);}
.tema:last-child{border-bottom:none;}
.tema input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);}
.tema .tt{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;}
.tema .tt b{font-weight:600;}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:calc(11.5px * var(--font-scale));font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;}
.ev svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.ev.fuerte{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);}
.ev.debil{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent);}
.ev.ninguna{color:var(--text2);background:var(--surface3);}
.pgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.pg{font-size:calc(11.5px * var(--font-scale));font-family:var(--mono);color:var(--text2);border:1px solid var(--border2);border-radius:6px;padding:0 7px;}
.snip{margin:6px 0 0;font-size:calc(12.5px * var(--font-scale));color:var(--text2);}
.snip summary{cursor:pointer;color:var(--text3);}
.snip blockquote{margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;}
.ag{padding:8px 0;border-bottom:1px solid var(--border);}
.ag:last-child{border-bottom:none;}
.ag .nm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;margin-bottom:4px;}
.mini-sig{display:flex;gap:10px;align-items:flex-start;margin:6px 0 0 2px;font-size:calc(13px * var(--font-scale));}
.save{font-size:calc(12px * var(--font-scale));color:var(--text3);margin-left:10px;text-transform:none;letter-spacing:0;font-weight:500;}
@media (max-width:760px){ .layout{grid-template-columns:1fr;} .caps{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px;} .cap{min-width:230px;width:auto;} .kp-row{grid-template-columns:repeat(2,minmax(0,1fr));} }

.embed .caps{top:8px;max-height:calc(100vh - 20px);}

/* memoria completa en un clic + tono */
.arm-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.arm-head h2{margin:0 0 2px;font-size:calc(16px * var(--font-scale));}
.arm-head p{margin:0;color:var(--text2);max-width:68ch;font-size:calc(12.5px * var(--font-scale));}
.btn.lg{padding:9px 18px;min-height:40px;font-size:calc(14px * var(--font-scale));}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none;}
.capchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.capchip{display:inline-flex;gap:6px;align-items:center;font-size:calc(11.5px * var(--font-scale));padding:2px 9px;border-radius:14px;border:1px solid var(--border2);color:var(--text2);}
.capchip.listo,.capchip.conservado{border-color:var(--low);color:var(--text);} .capchip.redactando{border-color:var(--accent);color:var(--text);} .capchip.error{border-color:var(--crit);color:var(--text);}
.capchip i{font-style:normal;font-weight:800;}
details.borr{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);margin-top:8px;}
details.borr > summary{cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none;}
details.borr > summary::-webkit-details-marker{display:none;}
details.borr > summary b{flex:1;min-width:200px;}
details.borr .in{padding:2px 14px 14px;}
textarea.borr{min-height:210px;}
.tono-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.tono-grid label{display:flex;flex-direction:column;gap:3px;font-size:calc(12px * var(--font-scale));color:var(--text3);font-weight:500;}
.tono-grid .full{grid-column:1 / -1;}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.dash-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;}
.pendrow{display:grid;grid-template-columns:minmax(120px,260px) 1fr 30px;gap:8px;align-items:center;font-size:calc(12px * var(--font-scale));margin-top:4px;}
@media (max-width:760px){ .tono-grid,.dash-row{grid-template-columns:1fr 1fr;} .tono-grid{grid-template-columns:1fr;} .pendrow{grid-template-columns:1fr 1fr 30px;} }

</style>

<main><div id="raiz"></div></main>
<script>
/* ==========================================================================
   DIRECTA — base común de los módulos (Dashboard y Memoria Anual)
   No llama a ninguna IA: solo lee lo que el backend ya guardó.
   ========================================================================== */
const LS = {font:"directa_font_scale", theme:"directa_theme", doc:"directa_doc_activo"};
/* Modo embebido: el módulo se muestra DENTRO del panel (index.html), que pone el menú lateral,
   el tema y el tamaño de letra. Aquí no se dibuja barra superior propia. */
const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.get("embed") === "1";
if(EMBED) document.documentElement.classList.add("embed");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : v; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsGetJSON(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSetJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- tema y tamaño de letra (mismas claves que index.html) ---------- */
function aplicarTema(t){ document.documentElement.setAttribute("data-theme", t); lsSet(LS.theme, t); }
function toggleTheme(){ aplicarTema(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
function aplicarFuente(scale){
  scale = Math.round(Math.max(0.8, Math.min(1.4, scale)) * 100) / 100;
  document.documentElement.style.setProperty("--font-scale", scale);
  lsSet(LS.font, String(scale));
  return scale;
}
function cambiarFuente(delta){
  const nuevo = aplicarFuente((parseFloat(lsGet(LS.font, "1")) || 1) + delta * 0.1);
  toast(`Tamaño de letra: ${Math.round(nuevo * 100)}%`);
}
(function initTema(){
  let t = EMBED && /^(dark|light)$/.test(PARAMS.get("theme") || "") ? PARAMS.get("theme") : lsGet(LS.theme, null);
  if(t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  aplicarFuente(EMBED && parseFloat(PARAMS.get("font")) ? parseFloat(PARAMS.get("font")) : (parseFloat(lsGet(LS.font, "1")) || 1));
})();

/* El panel (ventana madre) avisa cuando cambian el tema o el tamaño de letra. */
window.addEventListener("message", ev => {
  if(!EMBED || ev.source !== window.parent) return;
  const d = ev.data;

/* ---------- conexión con el backend ---------- */
let API = "";
async function responde(base){
  try{
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch(base + "/api/agentes", {signal: ctl.signal});
    clearTimeout(t);
    return r.ok;
  }catch(e){ return false; }
}
async function resolverAPI(){
  /* Dentro del panel la dirección del servidor ya viene confirmada: no se vuelve a probar. */
  if(EMBED && PARAMS.get("api")){ API = String(PARAMS.get("api")).replace(/\/+$/, ""); return true; }
  const candidatos = [PARAMS.get("api"), window.DIRECTA_API, /^https?:/.test(location.origin) ? location.origin : null, "http://localhost:8000"]
    .filter(Boolean).map(s => String(s).replace(/\/+$/, ""));
  for(const c of [...new Set(candidatos)]){ if(await responde(c)){ API = c; return true; } }
  API = candidatos[0] || "http://localhost:8000";
  return false;
}
async function getJSON(ruta){
  const r = await fetch(API + ruta);
  if(!r.ok) throw new Error("El servidor respondió " + r.status);
  return r.json();
}
function enlace(pagina){
  const api = PARAMS.get("api") || window.DIRECTA_API;
  return pagina + (api ? "?api=" + encodeURIComponent(api) : "");
}

/* ---------- tooltip único (texto siempre con textContent) ---------- */
(function initTip(){
  const tip = document.createElement("div");
  tip.id = "tip"; tip.setAttribute("role", "tooltip");
  document.addEventListener("DOMContentLoaded", () => document.body.appendChild(tip));
  let actual = null;
  function mostrar(el, ev){
    const txt = el.getAttribute("data-tip");
    if(!txt) return;
    tip.textContent = txt;
    tip.classList.add("on");
    const r = el.getBoundingClientRect();
    const px = ev && ev.clientX != null && ev.type !== "focusin" ? ev.clientX : r.left + r.width / 2;
    const py = ev && ev.clientY != null && ev.type !== "focusin" ? ev.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, px - w / 2), innerWidth - w - 8);
    let y = py - h - 14; if(y < 8) y = py + 18;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  document.addEventListener("pointermove", ev => {
    const el = ev.target.closest && ev.target.closest("[data-tip]");
    if(el){ actual = el; mostrar(el, ev); } else if(actual){ actual = null; tip.classList.remove("on"); }
  });
  document.addEventListener("focusin", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); if(el) mostrar(el, ev); });
  document.addEventListener("focusout", () => tip.classList.remove("on"));
  document.addEventListener("scroll", () => tip.classList.remove("on"), true);
})();

/* Descarga directa de un PDF que arma el servidor (sin ventana de impresión). */
async function descargarPdf(ruta, cuerpo, nombreArchivo, boton){
  const txt = boton ? boton.textContent : "";
  if(boton){ boton.disabled = true; boton.textContent = "Generando PDF…"; }
  try{
    const r = await fetch(API + ruta, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cuerpo || {})});
    if(!r.ok){
      let msg = "El servidor respondió " + r.status;
      try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
      throw new Error(msg);
    }
    descargar(nombreArchivo, await r.blob(), "application/pdf");
    toast("PDF descargado");
  }catch(e){
    toast("No se pudo generar el PDF: " + e.message, true);
  }finally{
    if(boton){ boton.disabled = false; boton.textContent = txt; }
  }
}

}
document.addEventListener("click", async ev => {
  const u = ev.target.closest("[data-act=usar-sug]");
  if(u && M.data){
    const r = M.sug[M.cap]; if(!r) return;
    const mem = capMem(M.cap), previo = (mem.notas || "").trim();
    const pend = (r.pendientes || []).map(p => "- " + p.dato + (p.quien ? " (" + p.quien + ")" : "")).join("\n");
    mem.notas = (previo ? previo + "\n\n" : "") + r.texto + (pend ? "\n\nPor completar:\n" + pend : "");
    saveMem(); const ta = $("#notas"); if(ta) ta.value = mem.notas;
    delete M.sug[M.cap]; pintarSug(M.cap); const m = $("#sugMsg"); if(m) m.textContent = "Agregado a tus notas. Edítalo a tu gusto."; return;
  }
  if(ev.target.closest("[data-act=descartar-sug]")){ delete M.sug[M.cap]; pintarSug(M.cap); return; }
  const b = ev.target.closest("[data-act=sugerir]"); if(!b || !M.data) return;
  const msg = $("#sugMsg"), cap = M.cap;
  b.disabled = true; msg.textContent = "Preparando borrador…";
  try{
    const r = await fetch(API + "/api/memoria/sugerir", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({capitulo: cap, docs: M.fuente === "__todos__" ? "" : M.fuente})}).then(x => x.json());
    if(!r.ok) throw new Error(r.error || "Sin respuesta");
    M.sug[cap] = r;
    if(M.cap === cap){ pintarSug(cap); msg.textContent = r.cache ? "Borrador listo (sin nueva consulta a la IA)." : "Borrador listo."; }
  }catch(e){ msg.textContent = "No se pudo sugerir: " + e.message; }
  finally{ b.disabled = false; }
});
/* ==========================================================================
   MEMORIA COMPLETA EN UN CLIC + TONO DE LA COMPAÑÍA
   El tono se MIDE por código en las memorias anteriores; la IA solo lo describe y tú lo apruebas.
   Cada borrador se revisa por código: las cifras sin respaldo se retiran y quedan como [COMPLETAR].
   ========================================================================== */
M.arm = {job: null, estado: "", hechos: 0, total: 0, capitulos: {}, mensaje: "", tono: "", errores: []};
M.borr = {}; M.dash = null; M.tono = null; M.abiertos = new Set(); M.tonoMsg = "";
const docsParam = () => M.fuente === "__todos__" ? "" : M.fuente;
const tituloCap = id => { const c = M.data && M.data.capitulos.find(x => x.id === id); return c ? `${c.numero}. ${c.titulo}` : id; };
const ESTADO_CAP = {pendiente: "En espera", redactando: "Redactando…", listo: "Listo", conservado: "Conservado (lo editaste)", error: "Con error"};
const ICO_CAP = {pendiente: "·", redactando: "…", listo: "✓", conservado: "✓", error: "!"};

async function postJSON(ruta, cuerpo, metodo){
  const r = await fetch(API + ruta, {method: metodo || "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cuerpo || {})});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok && !(j && j.error)) throw new Error("El servidor respondió " + r.status);
  return j || {};
}
async function cargarArmar(){
  const dp = encodeURIComponent(docsParam());
  const [b, d, t] = await Promise.all([
    getJSON("/api/memoria/borradores?docs=" + dp).catch(() => null),
    getJSON("/api/memoria/dashboard?docs=" + dp).catch(() => null),
    getJSON("/api/memoria/tono").catch(() => null)]);
  M.borr = (b && b.borradores) || {}; M.dash = d && d.ok ? d : null; M.tono = t && t.ok ? t : null;
  pintarArmar();
}
function guardarEdicionesPendientes(){
  $$("textarea[data-btxt]").forEach(t => { const b = M.borr[t.dataset.btxt]; if(b) b.texto = t.value; });
  M.abiertos = new Set($$("details.borr[open]").map(d => d.dataset.borr));
}

function pintarProgresoArmar(){
  const b = $("#armBarra"), m = $("#armMsg"), c = $("#armChips");
  if(!b || !m){ pintarArmar(); return; }
  const a = M.arm;
  b.style.width = (a.total ? Math.max(4, Math.round(100 * a.hechos / a.total)) : 4) + "%";
  m.textContent = `${a.mensaje || "Preparando…"} ${a.total ? `(${a.hechos}/${a.total} capítulos)` : ""}`;
  if(c) c.innerHTML = htmlChipsCaps();
}

async function armarMemoria(forzar){
  if(M.arm.estado === "corriendo" || !M.data) return;
  if(forzar && !confirm("Esto vuelve a redactar todos los capítulos, incluso los que editaste a mano. ¿Continuar?")) return;
  guardarEdicionesPendientes();
  M.arm = {job: null, estado: "corriendo", hechos: 0, total: 0, capitulos: {}, mensaje: "Iniciando…", tono: "", errores: []};
  pintarArmar();
  try{
    const r = await postJSON("/api/memoria/armar", {docs: docsParam(), forzar: !!forzar});
    if(!r.ok || !r.job_id) throw new Error(r.error || "sin respuesta");
    M.arm.job = r.job_id; sondearArmar(r.job_id, 0);
  }catch(e){ M.arm.estado = "error"; M.arm.mensaje = "No se pudo iniciar: " + e.message; pintarArmar(); }
}
function sondearArmar(job, fallos){
  clearTimeout(M._armT);
  M._armT = setTimeout(async () => {
    if(M.arm.job !== job) return;
    try{
      const e = await getJSON("/api/memoria/armar/" + job);
      if(!e.ok){ M.arm.estado = "error"; M.arm.mensaje = e.error || "Se perdió el trabajo (¿se reinició el servidor?)."; pintarArmar(); return; }
      Object.assign(M.arm, {estado: e.estado, hechos: e.hechos, total: e.total, capitulos: e.capitulos || {}, mensaje: e.mensaje, tono: e.tono || "", errores: e.errores || []});
      if(e.estado === "corriendo"){ pintarProgresoArmar(); sondearArmar(job, 0); return; }
      await cargarArmar();
      toast(e.estado === "listo" ? "Memoria redactada: revisa los borradores" : (e.mensaje || "No se pudo armar la memoria"), e.estado !== "listo");
    }catch(err){
      if(fallos < 3) sondearArmar(job, fallos + 1);
      else { M.arm.estado = "error"; M.arm.mensaje = "Se perdió la conexión con el servidor mientras se armaba la memoria."; pintarArmar(); }
    }
  }, 1500);
}

document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-bact]");
  if(a){
    const act = a.dataset.bact;
    if(act === "armar") return armarMemoria(false);
    if(act === "rehacer") return armarMemoria(true);
    if(act === "pdf") return descargarPdf("/api/memoria/pdf-completo", {docs: docsParam()}, "Memoria_Anual_Borrador.pdf", a);
    if(act === "guardar"){
      const cap = a.dataset.bcap, ta = document.querySelector(`textarea[data-btxt="${CSS.escape(cap)}"]`), msg = $("#bmsg-" + CSS.escape(cap));
      if(!ta || !ta.value.trim()){ if(msg) msg.textContent = "El texto no puede quedar vacío."; return; }
      a.disabled = true;
      try{
        const r = await postJSON("/api/memoria/borradores/" + encodeURIComponent(cap), {texto: ta.value, docs: docsParam()}, "PUT");
        if(!r.ok) throw new Error(r.error || "sin respuesta");
        M.borr[cap] = {...(M.borr[cap] || {}), ...(r.borrador || {}), texto: ta.value, estado: "editado"};
        if(msg) msg.textContent = "Guardado. Esta versión no se pisará al actualizar.";
        const pill = a.closest("details").querySelector("summary .pill"); if(pill){ pill.className = "pill est-listo"; pill.textContent = "Editado por ti"; }
      }catch(e){ if(msg) msg.textContent = "No se pudo guardar: " + e.message; }
      finally{ a.disabled = false; }
    }
    return;
  }
  const t = ev.target.closest("[data-tact]");
  if(!t) return;
  const act = t.dataset.tact, msg = $("#tonoMsg");
  t.disabled = true;
  try{
    if(act === "generar"){
      if(msg) msg.textContent = "Midiendo y describiendo el tono de tus memorias…";
      const r = await postJSON("/api/memoria/tono/generar", {});
      if(!r.ok) throw new Error(r.error || "sin respuesta");
      M.tonoMsg = r.aviso ? r.aviso : "Perfil generado como borrador. Revísalo y apruébalo para usarlo.";
      M.tono = await getJSON("/api/memoria/tono"); pintarArmar();
    } else if(act === "guardar" || act === "aprobar"){
      const id = t.dataset.tid, perfil = {...((M.tono && M.tono.borrador && M.tono.borrador.perfil) || {})};
      $$("[data-tono]").forEach(el => { const k = el.dataset.tono; perfil[k] = k === "reglas" ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value; });
      const g = await postJSON("/api/memoria/tono/" + encodeURIComponent(id), {perfil}, "PUT");
      if(!g.ok) throw new Error(g.error || "No se pudo guardar el perfil");
      if(act === "aprobar"){
        const r = await postJSON("/api/memoria/tono/" + encodeURIComponent(id) + "/aprobar", {});
        if(!r.ok) throw new Error(r.error || "No se pudo aprobar");
        M.tonoMsg = "Tono aprobado: desde ahora se usa para redactar la memoria.";
      } else M.tonoMsg = "Cambios guardados.";
      M.tono = await getJSON("/api/memoria/tono"); pintarArmar();
    }
  }catch(e){ if(msg) msg.textContent = "No se pudo completar: " + e.message; t.disabled = false; }
});

const LS_AY = "directa_ayuda_v2";
function ayudaEstado(){ try{ return JSON.parse(localStorage.getItem(LS_AY) || "{}") || {}; }catch(e){ return {}; } }
function ayudaGuardar(k, v){ try{ const o = ayudaEstado(); o[k] = v; localStorage.setItem(LS_AY, JSON.stringify(o)); }catch(e){} }
/* Abre/cierra el panel con una animación suave de altura */
function ayudaSlide(d, abrir){
  if(d.open === abrir) return;
  if(!d.animate || matchMedia("(prefers-reduced-motion: reduce)").matches){ d.open = abrir; return; }
  const h0 = d.offsetHeight;
  d.open = abrir;
  const h1 = d.offsetHeight;
  if(!abrir) d.open = true;
  d.style.overflow = "hidden";
  const a = d.animate([{height: h0 + "px"}, {height: h1 + "px"}], {duration: 240, easing: "ease"});
  a.onfinish = a.oncancel = () => { d.style.overflow = ""; d.open = abrir; };
}
/* Primera vez: abierto y se cierra solo al empezar a usar la pantalla (desplazar o pulsar fuera). Luego recuerda lo que elijas. */
function ayudaIniciar(d, k){
  if(!d || d.dataset.ayIni) return; d.dataset.ayIni = "1";
  const est = ayudaEstado()[k];
  d.open = est !== false;
  let armado = est === undefined && d.open;
  const cerrar = () => { if(!armado) return; armado = false; if(d.isConnected && d.open){ ayudaSlide(d, false); ayudaGuardar(k, false); } };
  const sum = d.querySelector("summary");
  if(sum) sum.addEventListener("click", e => { e.preventDefault(); armado = false; const ab = !d.open; ayudaSlide(d, ab); ayudaGuardar(k, ab); });
  document.addEventListener("scroll", e => { if(!armado) return; const t = e.target === document ? document.scrollingElement : e.target; if(t && t.scrollTop > 60) cerrar(); }, true);
  document.addEventListener("click", e => { if(armado && !d.contains(e.target)) cerrar(); }, true);
}
function recordarAyuda(){ ayudaIniciar(document.getElementById("ayuda"), "memoria"); }
window.alCambiarDoc = id => {
  if(!id || M.fuente === "__todos__" || id === M.fuente) return;
  if(!M.docs.find(d => d.id === id)){ M.forzar = true; return cargarDocs(); }
  M.fuente = id; pintarFiltros(); cargarCobertura();
};
window.alRefrescar = () => { M.forzar = true; return cargarDocs(); };
