<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DIRECTA — Indicadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>try{var q=new URLSearchParams(location.search);var t=q.get("embed")==="1"?q.get("theme"):null;if(t!=="dark"&&t!=="light")t=localStorage.getItem("directa_theme");if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --accent:#06B6D4; --accent2:#22D3EE; --accent-ink:#0E7490;
  --crit:#FF2D55; --high:#E05A5A; --med:#F4A261; --low:#50C878; --lime:#9ACD32;
  --radius:14px; --radius-sm:10px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-scale:1;
}
[data-theme="dark"]{
  --bg:#070710; --bg2:#0C0C16; --surface:#14141F; --surface2:#1B1B2A; --surface3:#232335;
  --text:#F0EEF8; --text2:#A6A6BE; --text3:#8A8AA6; --border:#26263A; --border2:#33334D;
  --accent-soft:#06B6D422; --glow:radial-gradient(ellipse at 30% 0%, #160f3a 0%, #070710 55%);
  --track:#2a2a40; --ink-on-fill:#0b0b14; color-scheme:dark;
}
[data-theme="light"]{
  --accent2:#0E7490;
  --crit:#D61F45; --high:#C94444; --med:#C77422; --low:#2E9E5B; --lime:#6E9B1F;
  --bg:#F4F6F9; --bg2:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --surface3:#EDF0F4;
  --text:#0B1220; --text2:#566072; --text3:#667085; --border:#E2E7EE; --border2:#D2D9E3;
  --accent-soft:#06B6D416; --glow:radial-gradient(ellipse at 30% 0%, #E6FBFF 0%, #F4F6F9 55%);
  --track:#E1E6EE; --ink-on-fill:#ffffff; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:calc(13px * var(--font-scale));line-height:1.45;min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:var(--accent2);}
[data-theme="light"] a{color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#062b31;padding:8px 14px;border-radius:8px;z-index:100;font-weight:600;}
.skip:focus{left:12px;}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;min-height:60px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:8px 0;}
.brand .iso{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand .iso svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand b{letter-spacing:3px;font-size:calc(15px * var(--font-scale));}
.brand small{display:block;font-size:calc(9px * var(--font-scale));color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;line-height:1.1;}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:8px;}
.nav a{padding:8px 13px;border-radius:9px;color:var(--text2);text-decoration:none;font-weight:500;font-size:calc(13px * var(--font-scale));}
.nav a:hover{background:var(--surface2);color:var(--text);}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent2);}
[data-theme="light"] .nav a[aria-current="page"]{color:var(--accent-ink);}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;}
.tb{min-width:36px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:calc(12.5px * var(--font-scale));}
.tb:hover{color:var(--text);border-color:var(--border2);}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

main{background:var(--glow);min-height:calc(100vh - 60px);}
.embed main{min-height:100vh;}
.embed .top{display:none;}
.wrap{max-width:1120px;margin:0 auto;padding:16px 20px 40px;}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;}
.head h1{margin:0;font-size:calc(20px * var(--font-scale));font-weight:600;letter-spacing:-.3px;}
.head p{margin:2px 0 0;color:var(--text2);max-width:70ch;font-size:calc(12.5px * var(--font-scale));}
.filters{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
.filters label{font-size:calc(12px * var(--font-scale));color:var(--text3);display:flex;flex-direction:column;gap:3px;font-weight:500;}
.field{min-height:32px;padding:4px 10px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--text);max-width:100%;}
select.field{padding-right:28px;}
textarea.field{width:100%;min-height:150px;resize:vertical;line-height:1.55;}
input.field.sm{min-height:32px;padding:4px 9px;width:100%;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;font-weight:600;background:var(--accent);color:#062b31;min-height:32px;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn.sm{padding:4px 10px;min-height:28px;font-size:calc(12px * var(--font-scale));}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.card + .card, .card + section, section + .card{margin-top:12px;}
.sec{margin-top:18px;}
.sec > h2{margin:0 0 2px;font-size:calc(15px * var(--font-scale));font-weight:600;}
.sec > .sub{margin:0 0 8px;color:var(--text2);font-size:calc(12px * var(--font-scale));}
.eyebrow{font-size:calc(11px * var(--font-scale));color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin:0 0 8px;}
.muted{color:var(--text2);} .faint{color:var(--text3);}
.grid{display:grid;gap:10px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:calc(11px * var(--font-scale));font-weight:700;letter-spacing:.4px;white-space:nowrap;border:1px solid transparent;}
.glyph{width:9px;height:9px;display:inline-block;flex-shrink:0;}
.g-crit{background:var(--crit);transform:rotate(45deg);} .g-high{background:var(--high);clip-path:polygon(50% 0,100% 100%,0 100%);} .g-med{background:var(--med);border-radius:50%;} .g-low{background:transparent;border:2px solid var(--low);border-radius:50%;}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent);}
.pill.high{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent);}
.pill.med{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent);}
.pill.low{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);}
.pill.neutral{color:var(--text2);background:var(--surface3);}
.tag{font-size:calc(10.5px * var(--font-scale));color:var(--text3);border:1px solid var(--border2);border-radius:6px;padding:0 6px;white-space:nowrap;}

/* tablas */
.tbl-wrap{overflow-x:auto;}
table.t{width:100%;border-collapse:collapse;}
.t th{font-size:calc(11px * var(--font-scale));color:var(--text3);letter-spacing:1px;text-transform:uppercase;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.t td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.t tr:last-child td{border-bottom:none;}
.t .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

/* medidores y barras */
.meter{height:10px;border-radius:5px;background:var(--track);position:relative;overflow:hidden;min-width:90px;}
.meter > i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;}
.stack{display:flex;gap:2px;height:14px;min-width:110px;}
.stack > i{display:block;height:100%;border-radius:3px;min-width:6px;}
.stack.empty{background:var(--track);border-radius:3px;opacity:.5;}
.band-ok{background:var(--low);} .band-leve{background:var(--lime);} .band-revision{background:var(--med);} .band-serio{background:var(--high);} .band-critico{background:var(--crit);}
.band-sin_analizar,.band-sin_info,.band-sin_datos{background:var(--border2);}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface3);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:calc(12.5px * var(--font-scale));max-width:320px;box-shadow:0 8px 28px #0006;white-space:pre-line;opacity:0;transition:opacity .08s;}
#tip.on{opacity:1;}
#tip b{font-weight:700;}
[data-tip]{cursor:default;}

.aviso{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);margin-bottom:10px;font-size:calc(12.5px * var(--font-scale));}
.aviso.warn{border-color:var(--med);background:color-mix(in srgb,var(--med) 10%,transparent);}
.aviso.err{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);}
.aviso b{color:var(--text);}
.empty{text-align:center;padding:28px 16px;color:var(--text2);}
.empty h3{margin:0 0 6px;color:var(--text);}
.loading{opacity:.55;transition:opacity .15s;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);padding:10px 18px;border-radius:12px;z-index:70;box-shadow:0 8px 28px #0006;}

@media (max-width:760px){
  .wrap{padding:12px 12px 40px;} .top{padding:0 16px;} .nav{order:3;width:100%;margin:0 0 8px;}
  .head h1{font-size:calc(18px * var(--font-scale));}
}
@media print{
  .top,.filters,.no-print,#tip,.toast{display:none !important;}
  body{background:#fff;color:#000;} main{background:none;} .card{break-inside:avoid;border-color:#ccc;}
  [data-theme="dark"]{--bg:#fff;--surface:#fff;--surface2:#f5f5f5;--surface3:#eee;--text:#000;--text2:#333;--text3:#555;--border:#ddd;--border2:#ccc;--track:#e5e5e5;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

.hero{grid-template-columns:minmax(280px,1fr) 2fr;align-items:stretch;}
.hero-num{font-size:calc(44px * var(--font-scale));font-weight:600;line-height:1;letter-spacing:-2px;}
.hero-num small{font-size:calc(15px * var(--font-scale));font-weight:500;color:var(--text3);letter-spacing:0;margin-left:4px;}
.band-line{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-weight:600;}
.band-line .dotb{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.scale{position:relative;height:12px;border-radius:6px;background:var(--track);}
.scale > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;}
.scale > u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--border2);text-decoration:none;}
.scale-lab{position:relative;height:1.4em;font-size:calc(11px * var(--font-scale));color:var(--text3);margin-top:5px;font-variant-numeric:tabular-nums;}
.scale-lab span{position:absolute;transform:translateX(-50%);}
.scale-lab span:first-child{transform:none;} .scale-lab span:last-child{transform:translateX(-100%);}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
.hero .kpi{justify-content:center;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;}
.kpis .kpi{justify-content:center;}
button.kpi:hover{border-color:var(--border2);background:var(--surface2);}
.kpi .l{font-size:calc(11.5px * var(--font-scale));color:var(--text2);display:flex;align-items:center;gap:7px;}
.kpi .v{font-size:calc(22px * var(--font-scale));font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:calc(12px * var(--font-scale));color:var(--text3);font-weight:500;}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{padding:3px 11px;border-radius:20px;font-size:calc(12.5px * var(--font-scale));font-weight:600;color:var(--text2);border:1px solid var(--border);background:var(--surface2);}
.chip:hover{color:var(--text);border-color:var(--border2);}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent2);border-color:var(--accent);}
[data-theme="light"] .chip[aria-pressed="true"]{color:var(--accent-ink);}
.ag-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;text-align:left;}
button.ag-name:hover{color:var(--accent2);}
.sc{display:flex;align-items:center;gap:10px;min-width:210px;}
.sc .n{font-weight:700;width:2.2em;text-align:right;font-variant-numeric:tabular-nums;}
.sc .meter{flex:1;}
.sc .lab{font-size:calc(11.5px * var(--font-scale));color:var(--text2);white-space:nowrap;min-width:9.5em;}
.stk-cell{min-width:210px;}
.stk-wrap{display:flex;align-items:center;gap:10px;}
.stk-cnt{font-size:calc(12px * var(--font-scale));color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:calc(12px * var(--font-scale));color:var(--text2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.sig{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;}
.sig:last-child{border-bottom:none;}
.sig .b{flex:1;min-width:0;} .sig b{display:block;} .sig p{margin:3px 0 0;color:var(--text2);font-size:calc(13px * var(--font-scale));}
.sig .who{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:calc(12px * var(--font-scale));color:var(--text3);}
.plan-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.plan-top .meter{flex:1;min-width:160px;max-width:380px;}
.plan td.rec{min-width:260px;} .plan td.who-c{min-width:150px;} .plan td.fec{min-width:140px;} .plan td.est{min-width:130px;}
.plan tr.hecho td.rec{color:var(--text3);text-decoration:line-through;}
.cmp-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
.cmp-big{font-size:calc(28px * var(--font-scale));font-weight:600;font-variant-numeric:tabular-nums;}
.delta{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;}
.delta.up{color:var(--low);} .delta.down{color:var(--crit);} .delta.eq{color:var(--text3);}
.dumb{position:relative;height:22px;min-width:220px;}
.dumb .rail{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--track);}
.dumb .seg{position:absolute;top:9px;height:4px;border-radius:2px;background:var(--text3);opacity:.55;}
.dumb .dot{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--surface);}
.dumb .dot.a{background:var(--text3);} .dumb .dot.b{background:var(--accent);}
.cmp-lists{display:grid;gap:12px;margin-top:16px;}
details.det{border:1px solid var(--border);border-radius:12px;background:var(--surface2);}
details.det > summary{padding:10px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;}
details.det > summary::-webkit-details-marker{display:none;}
details.det > summary::before{content:"▸";color:var(--text3);} details.det[open] > summary::before{content:"▾";}
details.det .in{padding:0 14px 8px;}
@media (max-width:820px){ .hero{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:520px){ .hero-num{font-size:calc(52px * var(--font-scale));} }
@media (max-width:640px){
  .sc{min-width:0;flex-wrap:wrap;gap:4px 8px;}
  .sc .meter{min-width:70px;}
  .sc .lab{flex-basis:100%;min-width:0;white-space:normal;padding-left:calc(2.2em + 8px);}
  .stk-cell{min-width:140px;}
}


/* indicadores */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
.ind-grid .card + .card{margin-top:0;}
.ind{border-left:4px solid var(--c,var(--border2));display:flex;flex-direction:column;}
.ind.e-verde{--c:var(--low);} .ind.e-amarillo{--c:var(--med);} .ind.e-rojo{--c:var(--crit);} .ind.e-sin_dato{--c:var(--border2);}
.ind-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
.ind h3{margin:0 0 6px;font-size:calc(14.5px * var(--font-scale));font-weight:600;}
.ind-val{font-size:calc(34px * var(--font-scale));font-weight:600;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.bul{position:relative;height:14px;margin:10px 0 2px;}
.bul .bz{position:absolute;inset:4px 0;border-radius:3px;overflow:hidden;opacity:.55;}
.bul .bz i{position:absolute;top:0;bottom:0;}
.bul b{position:absolute;top:0;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:var(--text);}
.bul u{position:absolute;top:1px;width:0;height:12px;border-left:2px dashed var(--text3);text-decoration:none;}
.bul-l{display:flex;justify-content:space-between;font-size:calc(10.5px * var(--font-scale));color:var(--text3);}
.ind-val small{font-size:calc(14px * var(--font-scale));color:var(--text3);font-weight:500;margin-left:3px;letter-spacing:0;}
.ind-sol{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.sol-list{margin:0 0 8px;padding-left:18px;color:var(--text2);} .sol-list li{margin-bottom:3px;}
.sol-txt{margin:0 0 8px;white-space:pre-wrap;}
.ind-f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.ind-f .fld:first-child{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:3px;font-size:calc(12px * var(--font-scale));color:var(--text3);font-weight:500;}
.fld .field{width:100%;color:var(--text);}
.sm-ta{min-height:54px !important;width:100%;resize:vertical;}
.frm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.venc{margin:8px 0 0;color:var(--crit);font-weight:600;font-size:calc(12px * var(--font-scale));}
@media (max-width:640px){ .ind-f,.frm-grid{grid-template-columns:1fr;} .frm-grid > *{grid-column:auto !important;} }
</style>
</head>
<body>
<main><div id="raiz"></div></main>
<script>
const LS = {font:"directa_font_scale", theme:"directa_theme", doc:"directa_doc_activo"};
const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.get("embed") === "1";
if(EMBED) document.documentElement.classList.add("embed");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : v; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsGetJSON(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSetJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- tema y tamaño de letra (mismas claves que index.html) ---------- */
function aplicarTema(t){ document.documentElement.setAttribute("data-theme", t); lsSet(LS.theme, t); }
function toggleTheme(){ aplicarTema(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
function aplicarFuente(scale){
  scale = Math.round(Math.max(0.8, Math.min(1.4, scale)) * 100) / 100;
  document.documentElement.style.setProperty("--font-scale", scale);
  lsSet(LS.font, String(scale));
  return scale;
}

let API = "";
async function responde(base){
  try{
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch(base + "/api/agentes", {signal: ctl.signal});
    clearTimeout(t);
    return r.ok;
  }catch(e){ return false; }
}
async function resolverAPI(){
  if(EMBED && PARAMS.get("api")){ API = String(PARAMS.get("api")).replace(/\/+$/, ""); return true; }
  const candidatos = [PARAMS.get("api"), window.DIRECTA_API, /^https?:/.test(location.origin) ? location.origin : null, "http://localhost:8000"]
    .filter(Boolean).map(s => String(s).replace(/\/+$/, ""));
  for(const c of [...new Set(candidatos)]){ if(await responde(c)){ API = c; return true; } }
  API = candidatos[0] || "http://localhost:8000";
  return false;
}
async function getJSON(ruta){
  const r = await fetch(API + ruta);
  if(!r.ok) throw new Error("El servidor respondió " + r.status);

}

/* ---------- tooltip ---------- */
(function initTip(){
  const tip = document.createElement("div");
  tip.id = "tip"; tip.setAttribute("role", "tooltip");
  document.addEventListener("DOMContentLoaded", () => document.body.appendChild(tip));
  let actual = null;
  function mostrar(el, ev){
    const txt = el.getAttribute("data-tip");
    if(!txt) return;
    tip.textContent = txt;
    tip.classList.add("on");
    const r = el.getBoundingClientRect();
    const px = ev && ev.clientX != null && ev.type !== "focusin" ? ev.clientX : r.left + r.width / 2;
    const py = ev && ev.clientY != null && ev.type !== "focusin" ? ev.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, px - w / 2), innerWidth - w - 8);
    let y = py - h - 14; if(y < 8) y = py + 18;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  document.addEventListener("pointermove", ev => {
    const el = ev.target.closest && ev.target.closest("[data-tip]");
    if(el){ actual = el; mostrar(el, ev); } else if(actual){ actual = null; tip.classList.remove("on"); }
  });
  document.addEventListener("focusin", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); if(el) mostrar(el, ev); });
  document.addEventListener("focusout", () => tip.classList.remove("on"));
  document.addEventListener("scroll", () => tip.classList.remove("on"), true);
})();

function semaforo(valor, meta, limite, dir){
  const v = parseFloat(valor), m = parseFloat(meta);
  let l = parseFloat(limite);
  if(Number.isNaN(v) || Number.isNaN(m)) return "sin_dato";
  if(Number.isNaN(l)) l = m;
  if(dir === "menor") return v <= m ? "verde" : (v <= l ? "amarillo" : "rojo");
  return v >= m ? "verde" : (v >= l ? "amarillo" : "rojo");
}
const num = x => { const n = parseFloat(x); return Number.isNaN(n) ? null : n; };
const fmtNum = x => { const n = num(x); return n === null ? "—" : (Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100)); };

function secTipo(tipo, todos){
  const lista = todos.filter(i => i.tipo === tipo).sort((a, b) => ["rojo", "amarillo", "sin_dato", "verde"].indexOf(a.estado) - ["rojo", "amarillo", "sin_dato", "verde"].indexOf(b.estado));

function textoMeta(i){

  return `Meta: ${m}${lim}`;
}
function barraInd(i){
  const v = parseFloat(i.valor), m = parseFloat(i.meta), l = (i.limite === null || i.limite === "" || i.limite === undefined) ? NaN : parseFloat(i.limite);
  if(isNaN(v) || isNaN(m)) return "";
  const menor = (i.direccion || (i.tipo === "KRI" ? "menor" : "mayor")) === "menor";
  const max = Math.max(v, m, isNaN(l) ? 0 : l, 1) * 1.25, p = x => Math.max(0, Math.min(100, x / max * 100));
  const lim = isNaN(l) ? m : l;

  else zonas = [[0, p(lim), "var(--high)"], [p(lim), p(m), "var(--med)"], [p(m), 100, "var(--low)"]];
  const z = zonas.filter(a => a[1] > a[0]).map(a => `<i style="left:${a[0]}%;width:${a[1] - a[0]}%;background:${a[2]}"></i>`).join("");

function tarjeta(i){

  const vencida = fechaCampo && estSol !== "hecho" && fechaCampo < hoyIso() && i.estado !== "verde";
  return `<article class="card ind e-${i.estado}" data-card="${esc(i.id)}">

        <label class="fld">Fecha límite<input class="field sm" type="date" data-src="${src}" data-id="${esc(i.id)}" data-f="fecha" value="${esc(fechaCampo)}"></label>

    <p class="muted" style="margin:0 0 10px;font-size:calc(12px * var(--font-scale))">Completa lo básico. El semáforo se calcula solo con el valor, la meta y el límite.</p>
    <div class="frm-grid">
      <label class="fld">Tipo<select class="field sm" id="f-tipo"><option value="KPI" ${esKri ? "" : "selected"}>KPI — desempeño (más alto es mejor)</option><option value="KRI" ${esKri ? "selected" : ""}>KRI — riesgo (más bajo es mejor)</option></select></label>
      <label class="fld" style="grid-column:span 2">Nombre del indicador *<input class="field sm" id="f-nombre" value="${v("nombre")}" placeholder="Ej: Ventas versus presupuesto" maxlength="120" required></label>
      <label class="fld">Unidad<input class="field sm" id="f-unidad" value="${v("unidad")}" placeholder="% , $, días…" maxlength="12"></label>
      <label class="fld">Valor actual *<input class="field sm" id="f-valor" inputmode="decimal" value="${v("valor")}" placeholder="Ej: 92" required></label>
      <label class="fld">Meta *<input class="field sm" id="f-meta" inputmode="decimal" value="${v("meta")}" placeholder="${esKri ? "Máximo aceptable" : "Lo que queremos lograr"}" required></label>
      <label class="fld">Límite (pasa a rojo)<input class="field sm" id="f-limite" inputmode="decimal" value="${v("limite")}" placeholder="${esKri ? "Sobre este valor es rojo" : "Bajo este valor es rojo"}"></label>
      <label class="fld" style="grid-column:1/-1">Solución / acción a tomar<textarea class="field sm-ta" id="f-solucion" rows="2" placeholder="Qué se hará si el indicador no está en verde">${v("solucion")}</textarea></label>
      <label class="fld">Responsable<input class="field sm" id="f-resp" value="${v("responsable")}" placeholder="Nombre o área"></label>
      <label class="fld">Fecha límite<input class="field sm" type="date" id="f-fecha" value="${v("fecha")}"></label>
    </div>
    <p id="frmError" class="venc" role="alert" style="display:none"></p>
    <div class="chips" style="margin-top:12px"><button class="btn" type="submit">Guardar indicador</button><button class="btn ghost" type="button" data-act="ia-form" title="Propone unidad, meta, límite y solución a partir del nombre">Sugerir con IA</button><span class="faint" id="iaMsg" role="status" style="font-size:calc(12px * var(--font-scale))"></span><button class="btn ghost" type="button" data-act="cancelar">Cancelar</button></div>
  </form>`;
}
function guardarForm(ev){
  ev.preventDefault();
  const g = id => ($("#" + id)?.value ?? "").trim();
  const err = m => { const e = $("#frmError"); e.textContent = m; e.style.display = "block"; };
  const nombre = g("f-nombre");
  if(!nombre) return err("Escribe el nombre del indicador.");
  const dec = id => g(id).replace(",", ".");
  if(num(dec("f-valor")) === null) return err("El valor actual debe ser un número.");
  if(num(dec("f-meta")) === null) return err("La meta debe ser un número.");
  if(dec("f-limite") !== "" && num(dec("f-limite")) === null) return err("El límite debe ser un número (o déjalo vacío).");
  const tipo = g("f-tipo") === "KRI" ? "KRI" : "KPI";
  const previo = I.propios.find(p => p.id === I.form.id) || {};
  const nuevo = {
    ...previo, id: previo.id || ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    tipo, direccion: tipo === "KRI" ? "menor" : "mayor", nombre, unidad: g("f-unidad"),
    valor: num(dec("f-valor")), meta: num(dec("f-meta")), limite: dec("f-limite") === "" ? null : num(dec("f-limite")),
    solucion: g("f-solucion"), responsable: g("f-resp"), fecha: g("f-fecha"), estado_solucion: previo.estado_solucion || "pendiente",
  };
  const k = I.propios.findIndex(p => p.id === nuevo.id);
  if(k >= 0) I.propios[k] = nuevo; else I.propios.push(nuevo);
  saveProp(); I.form = null; pintar(); toast("Indicador guardado");
}

/* ---------- copia de respaldo ---------- */
function exportarCopia(){
  descargar(`Indicadores_Directa_${hoyIso()}.json`, JSON.stringify({version: 1, propios: I.propios, ajustes: I.ajustes}, null, 2), "application/json");
  toast("Copia guardada");
}
function importarCopia(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(String(rd.result));
      const nuevos = arr(j.propios).filter(p => p && p.id && p.nombre);
      nuevos.forEach(p => { const k = I.propios.findIndex(x => x.id === p.id); if(k >= 0) I.propios[k] = p; else I.propios.push(p); });
      I.ajustes = {...I.ajustes, ...obj(j.ajustes)};
      saveProp(); saveAj(); pintar(); toast(`Copia cargada (${nuevos.length} indicadores propios)`);
    }catch(e){ toast("El archivo no es una copia válida", true); }
    ev.target.value = "";
  };
  rd.readAsText(f);
}
function exportarPdf(boton){
  const aj = {};
  Object.entries(I.ajustes).forEach(([k, v]) => {
    const [doc, ...resto] = k.split("|");
    if(doc === String(I.docId)) aj[resto.join("|")] = {responsable: v.responsable, fecha: v.fecha, estado_solucion: v.estado, solucion: v.solucion};
  });
  descargarPdf("/api/indicadores/pdf", {documento_id: I.docId, propios: I.propios, ajustes: aj}, `Indicadores_${hoyIso()}.pdf`, boton);
}


async function pedirIA(cuerpo){
  const r = await fetch(API + "/api/indicadores/sugerir", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({documento_id: I.docId, ...cuerpo})}).then(x => x.json());
  if(!r.ok) throw new Error(r.error || "Sin respuesta");
  return r;
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act=ia-form],[data-act=ia-sol]"); if(!b) return;
  b.disabled = true;
  try{
    if(b.dataset.act === "ia-form"){
      const msg = $("#iaMsg"); msg.textContent = "Pensando…";
      const g = id => ($("#" + id)?.value ?? "").trim();
      const r = await pedirIA({modo: "form", tipo: g("f-tipo"), nombre: g("f-nombre")});
      const poner = (id, val) => { const el = $("#" + id); if(el && !el.value.trim() && val !== null && val !== undefined && val !== "") el.value = String(val).replace(".", ","); };
      poner("f-nombre", r.nombre); poner("f-unidad", r.unidad); poner("f-meta", r.meta); poner("f-limite", r.limite);
      poner("f-solucion", r.solucion); poner("f-resp", r.responsable);
      msg.textContent = "Listo: completé solo los campos vacíos. Ingresa el valor actual y revisa meta y límite.";
    }else{
      const it = arr(I.sug && I.sug.indicadores).find(x => String(x.id) === b.dataset.id) || {};
      const aj = ajusteDe(b.dataset.id);
      const r = await pedirIA({modo: "solucion", tipo: it.tipo, nombre: it.nombre, valor: it.valor, meta: it.meta, limite: it.limite, unidad: it.unidad, estado: it.estado});
      const k = claveAj(b.dataset.id), a = {...obj(I.ajustes[k])};
      a.solucion = ((a.solucion || "").trim() ? a.solucion.trim() + "\n" : "") + r.solucion;
      if(!a.responsable && r.responsable) a.responsable = r.responsable;
      I.ajustes[k] = a; saveAj(); pintar(); toast("Solución sugerida agregada. Revísala.");
    }
  }catch(e){ const m = $("#iaMsg"); if(m) m.textContent = "No se pudo: " + e.message; else toast("No se pudo sugerir: " + e.message, true); }
  finally{ b.disabled = false; }
});
/* ---------- eventos ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act === "nuevo"){ I.form = {tipo: "KPI"}; pintar(); $("#frmInd")?.scrollIntoView({behavior: "smooth", block: "center"}); $("#f-nombre")?.focus(); }
  else if(act === "editar"){ const p = I.propios.find(x => x.id === b.dataset.id); if(p){ I.form = {...p}; pintar(); $("#frmInd")?.scrollIntoView({behavior: "smooth", block: "center"}); $("#f-nombre")?.focus(); } }
  else if(act === "eliminar"){ const p = I.propios.find(x => x.id === b.dataset.id); if(p && confirm(`¿Eliminar el indicador "${p.nombre}"?`)){ I.propios = I.propios.filter(x => x.id !== p.id); saveProp(); pintar(); toast("Indicador eliminado"); } }
  else if(act === "cancelar"){ I.form = null; pintar(); }
  else if(act === "export"){ exportarCopia(); }
  else if(act === "import"){ $("#fileImp").click(); }
  else if(act === "pdf"){ exportarPdf(b); }
});
document.addEventListener("submit", ev => { if(ev.target.id === "frmInd") guardarForm(ev); });
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id === "f-tipo" && I.form){
    const g = id => $("#" + id)?.value ?? "";
    I.form = {...I.form, tipo: t.value, nombre: g("f-nombre"), unidad: g("f-unidad"), valor: g("f-valor"), meta: g("f-meta"), limite: g("f-limite"),
      solucion: g("f-solucion"), responsable: g("f-resp"), fecha: g("f-fecha")};
    pintar(); return;
  }
  if(t.dataset && t.dataset.f) guardarCampo(t);
});
document.addEventListener("input", ev => { const t = ev.target; if(t.dataset && (t.dataset.f === "responsable" || t.dataset.f === "solucion")) guardarCampo(t); });
function guardarCampo(el){
  const id = el.dataset.id, f = el.dataset.f;
  if(el.dataset.src === "aj"){
    const k = claveAj(id), a = {...obj(I.ajustes[k])};
    a[f] = el.value; I.ajustes[k] = a; saveAj();
  }else{
    const p = I.propios.find(x => x.id === id); if(!p) return;
    if(f === "estado") p.estado_solucion = el.value; else p[f] = el.value;
    saveProp();
  }
  if(f === "estado" || f === "fecha"){ const c = el.closest(".ind"); if(c){ const w = c.querySelector(".venc:not(#frmError)"); if(w) w.remove(); } }
}
const LS_AY = "directa_ayuda_v2";
function ayudaEstado(){ try{ return JSON.parse(localStorage.getItem(LS_AY) || "{}") || {}; }catch(e){ return {}; } }
function ayudaGuardar(k, v){ try{ const o = ayudaEstado(); o[k] = v; localStorage.setItem(LS_AY, JSON.stringify(o)); }catch(e){} }
/* Abre/cierra el panel con una animación suave de altura */
function ayudaSlide(d, abrir){
  if(d.open === abrir) return;
  if(!d.animate || matchMedia("(prefers-reduced-motion: reduce)").matches){ d.open = abrir; return; }
  const h0 = d.offsetHeight;
  d.open = abrir;
  const h1 = d.offsetHeight;
  if(!abrir) d.open = true;
  d.style.overflow = "hidden";
  const a = d.animate([{height: h0 + "px"}, {height: h1 + "px"}], {duration: 240, easing: "ease"});
  a.onfinish = a.oncancel = () => { d.style.overflow = ""; d.open = abrir; };
}

function ayudaIniciar(d, k){
  if(!d || d.dataset.ayIni) return; d.dataset.ayIni = "1";
  const est = ayudaEstado()[k];
  d.open = est !== false;
  let armado = est === undefined && d.open;
  const cerrar = () => { if(!armado) return; armado = false; if(d.isConnected && d.open){ ayudaSlide(d, false); ayudaGuardar(k, false); } };
  const sum = d.querySelector("summary");
  if(sum) sum.addEventListener("click", e => { e.preventDefault(); armado = false; const ab = !d.open; ayudaSlide(d, ab); ayudaGuardar(k, ab); });
  document.addEventListener("scroll", e => { if(!armado) return; const t = e.target === document ? document.scrollingElement : e.target; if(t && t.scrollTop > 60) cerrar(); }, true);
  document.addEventListener("click", e => { if(armado && !d.contains(e.target)) cerrar(); }, true);
}
function recordarAyuda(){ ayudaIniciar(document.getElementById("ayuda"), "indicadores"); }
window.alCambiarDoc = id => {
  if(!id || id === I.docId) return;
  if(!I.docs.find(d => d.id === id)){ I.forzar = true; return cargarDocs(); }
  I.docId = id; pintarFiltros(); cargarSugeridos();
};
window.alRefrescar = () => { I.forzar = true; return cargarDocs(); };
document.addEventListener("DOMContentLoaded", iniciar);

</script>
