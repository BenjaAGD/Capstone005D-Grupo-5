# Compilación en la nube con Codemagic (codemagic.io): conecta este repositorio y elige el flujo.
# Cada compilación deja el APK descargable en la página del build.
workflows:
  android-apk:
    name: DIRECTA GG · APK Android
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        # Dirección del backend que usará la app por defecto (también se puede cambiar dentro de la app)
        API_BASE_URL: https://tu-backend.ejemplo.com
    scripts:
      - name: Dependencias
        script: cd app && flutter pub get
      - name: Pruebas
        script: cd app && flutter test
      - name: Compilar APK
        script: cd app && flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - tu-correo@ejemplo.com
