<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DIRECTA — Módulo Gerencia General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#06B6D4; --accent2:#22D3EE; --accent-ink:#0E7490;
    --crit:#FF2D55; --high:#E05A5A; --med:#F4A261; --low:#50C878; --info:#4A9FD4; --gold:#C9A84C; --purple:#C77DFF;
    --radius:14px; --radius-sm:10px; --radius-lg:20px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --font-scale:1;
  }
  [data-theme="dark"]{
    --bg:#070710; --bg2:#0C0C16; --surface:#14141F; --surface2:#1B1B2A; --surface3:#23233560;
    --text:#F0EEF8; --text2:#A6A6BE; --text3:#8A8AA6; --border:#26263A; --border2:#33334D;
    --accent-soft:#06B6D422; --glow:radial-gradient(ellipse at 30% 0%, #160f3a 0%, #070710 55%);
  }
  [data-theme="light"]{
    --accent2:#0E7490;
    --bg:#F4F6F9; --bg2:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --surface3:#EDF0F4;
    --text:#0B1220; --text2:#566072; --text3:#667085; --border:#E2E7EE; --border2:#D2D9E3;
    --accent-soft:#06B6D416; --glow:radial-gradient(ellipse at 30% 0%, #E6FBFF 0%, #F4F6F9 55%);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:calc(14px * var(--font-scale));line-height:1.5;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden;}
  .sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:6px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:8px;}
  .brand .iso{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand .iso svg{width:20px;height:20px;}
  .brand h1{font-size:calc(17px * var(--font-scale));margin:0;letter-spacing:3px;font-weight:700;}
  .brand p{margin:0;font-size:calc(9.5px * var(--font-scale));color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;}
  .nav-label{font-size:calc(10px * var(--font-scale));color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:14px 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text2);font-size:calc(13.5px * var(--font-scale));font-weight:500;transition:.15s;text-align:left;width:100%;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent2);}
  [data-theme="light"] .nav-item.active{color:var(--accent-ink);}
  .nav-item .badge{margin-left:auto;background:var(--surface3);color:var(--text3);font-size:calc(9.5px * var(--font-scale));font-weight:700;padding:2px 7px;border-radius:9px;letter-spacing:.5px;text-transform:uppercase;}
  .nav-item .badge.soon{background:#C77DFF22;color:var(--purple);}
  .nav-item .badge.count{background:var(--accent);color:#062b31;}
  .sidebar-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--border);}
  .profile{display:flex;align-items:center;gap:10px;padding:8px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:calc(13px * var(--font-scale));color:var(--text3);flex-shrink:0;border:1px dashed var(--border2);}
  .profile .nm{font-size:calc(13px * var(--font-scale));font-weight:600;color:var(--text2);}
  .profile .rl{font-size:calc(11px * var(--font-scale));color:var(--text3);}

  .main{display:flex;flex-direction:column;overflow:hidden;background:var(--glow);position:relative;}
  .topbar{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 26px;flex-shrink:0;background:var(--bg2);}
  .crumbs{font-size:calc(13px * var(--font-scale));color:var(--text2);}
  .crumbs b{color:var(--text);font-weight:600;}
  .tb-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);border:1px solid var(--border);background:var(--surface2);}
  .tb-btn:hover{color:var(--text);border-color:var(--border2);}
  .tb-btn svg{width:17px;height:17px;}
  .tb-btn.text-btn{font-family:var(--mono);font-weight:600;font-size:calc(13px * var(--font-scale));width:auto;padding:0 11px;height:34px;}
  .tb-btn.text-btn:hover{border-color:var(--accent);color:var(--accent2);}
  .tb-right{margin-left:auto;display:flex;gap:6px;align-items:center;}

  .content{flex:1;overflow-y:auto;padding:26px 30px 60px;}
  .view{max-width:1180px;margin:0 auto;}
  .view.anim{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .bg-banner{position:fixed;top:74px;right:24px;z-index:50;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:460px;}
  .bg-banner.paused{border-color:var(--med);}
  .bg-banner .ico{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bg-banner .ico svg{width:16px;height:16px;animation:spin 2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .bg-banner .txt{flex:1;min-width:0;}
  .bg-banner .txt b{font-size:calc(12.5px * var(--font-scale));display:block;margin-bottom:2px;}
  .bg-banner .txt span{font-size:calc(11px * var(--font-scale));color:var(--text2);}
  .bg-banner .bar-track{margin-top:6px;height:4px;}
  .bg-banner .btn-ctrl{width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
  .bg-banner .btn-ctrl:hover{filter:brightness(1.15);}
  .bg-banner .btn-ctrl.pause{background:var(--med);}
  .bg-banner .btn-ctrl.resume{background:var(--low);}
  .bg-banner .btn-ctrl.stop{background:var(--crit);}
  .bg-banner .btn-ctrl svg{width:14px;height:14px;}
  .bg-banner .btn-close{width:24px;height:24px;border-radius:6px;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bg-banner .btn-close:hover{color:var(--text);}
  .bg-banner .btn-close svg{width:14px;height:14px;}

  .page-head{margin:0 0 22px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .page-head h2{font-size:calc(23px * var(--font-scale));margin:0 0 4px;font-weight:700;letter-spacing:-.3px;}
  .page-head p{margin:0;color:var(--text2);font-size:calc(14px * var(--font-scale));max-width:720px;}
  .page-head .spacer{flex:1;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .grid{display:grid;gap:16px;}
  .sec-title{font-size:calc(11px * var(--font-scale));color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px;font-weight:600;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:calc(11px * var(--font-scale));font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .kpi .v{font-size:calc(27px * var(--font-scale));font-weight:300;line-height:1;}
  .kpi .l{font-size:calc(12px * var(--font-scale));color:var(--text2);margin-top:6px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-size:calc(13px * var(--font-scale));font-weight:600;background:var(--accent);color:#062b31;transition:.15s;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--crit);color:#fff;}
  .btn.sm{padding:6px 12px;font-size:calc(12px * var(--font-scale));}
  .btn.lg{padding:13px 22px;font-size:calc(14px * var(--font-scale));}
  .btn:disabled{opacity:.45;cursor:default;filter:none;}
  .btn svg{width:15px;height:15px;}
  .bar-track{height:7px;border-radius:5px;background:var(--surface3);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:var(--accent);transition:width .4s ease;}
  .hidden{display:none!important;}
  .kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:calc(13px * var(--font-scale));}
  .kv .k{color:var(--text3);width:150px;flex-shrink:0;}
  .kv:last-child{border-bottom:none;}

  .empty{text-align:center;padding:48px 24px;color:var(--text2);}
  .empty .ic{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
  .empty .ic svg{width:26px;height:26px;color:var(--text3);}
  .empty h3{margin:0 0 6px;font-size:calc(16px * var(--font-scale));color:var(--text);font-weight:600;}
  .empty p{margin:0 0 20px;font-size:calc(13px * var(--font-scale));max-width:400px;margin-left:auto;margin-right:auto;}

  .checklist-step{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;transition:.15s;}
  .checklist-step.done{border-color:#50C87844;background:linear-gradient(90deg,#50C87808,var(--surface));}
  .checklist-step.available{border-color:var(--accent);cursor:pointer;}
  .checklist-step.available:hover{transform:translateX(3px);}
  .checklist-step.locked{opacity:.55;}
  .checklist-step .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:calc(12px * var(--font-scale));font-weight:700;font-family:var(--mono);color:var(--text3);}
  .checklist-step.done .chk{background:var(--low);border-color:var(--low);color:#052e16;}
  .checklist-step.available .chk{border-color:var(--accent);color:var(--accent2);}
  .checklist-step .info{flex:1;}
  .checklist-step .info b{font-size:calc(14px * var(--font-scale));display:block;margin-bottom:2px;}
  .checklist-step .info span{font-size:calc(12.5px * var(--font-scale));color:var(--text2);}
  .checklist-step .meta{font-size:calc(12px * var(--font-scale));color:var(--text3);text-align:right;font-family:var(--mono);}

  .upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:32px 24px;text-align:center;transition:.2s;cursor:pointer;background:var(--surface2);}
  .upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:var(--accent-soft);}
  .upload-zone .ic{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
  .upload-zone .ic svg{width:24px;height:24px;color:var(--accent2);}
  .upload-zone b{font-size:calc(15px * var(--font-scale));display:block;margin-bottom:4px;}
  .upload-zone span{font-size:calc(12.5px * var(--font-scale));color:var(--text2);}

  .progress-circular{
    display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--accent);
    border-radius:10px;background:var(--accent-soft);margin-top:16px;
  }
  .circular-wrap{position:relative;width:56px;height:56px;flex-shrink:0;}
  .circular-wrap svg{transform:rotate(-90deg);}
  .circular-pct{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(11px * var(--font-scale));font-weight:600;font-family:var(--mono);color:var(--accent2);
  }
  .circular-info{flex:1;min-width:0;}
  .circular-info b{font-size:calc(13px * var(--font-scale));display:block;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .circular-info span{font-size:calc(12px * var(--font-scale));color:var(--text2);}
  .circular-time{font-family:var(--mono);font-size:calc(12px * var(--font-scale));color:var(--accent2);font-weight:600;white-space:nowrap;}

  .doc-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:9px;background:var(--surface2);transition:.15s;}
  .doc-row:hover{border-color:var(--border2);}
  .doc-row .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(11px * var(--font-scale));flex-shrink:0;letter-spacing:.5px;font-family:var(--mono);background:var(--surface3);color:var(--text2);}
  .doc-row .info{flex:1;min-width:0;}
  .doc-row .info b{font-size:calc(13.5px * var(--font-scale));display:block;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-row .info .meta{font-size:calc(11.5px * var(--font-scale));color:var(--text3);}
  .doc-row .status{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--font-scale));}
  .doc-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .doc-row .icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);border:1px solid var(--border);background:var(--surface);transition:.15s;}
  .doc-row .icon-btn:hover{color:var(--text);border-color:var(--border2);}
  .doc-row .icon-btn.danger:hover{color:var(--crit);border-color:var(--crit);}
  .doc-row .icon-btn svg{width:14px;height:14px;}

  .chat-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - 150px);}
  .chat-topbar{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .agente-selector{position:relative;}
  .agente-trigger{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:calc(13px * var(--font-scale));font-weight:600;transition:.15s;min-width:200px;}
  .agente-trigger:hover{border-color:var(--accent);}
  .agente-trigger .arr{margin-left:auto;color:var(--text3);transition:.2s;display:flex;}
  .agente-trigger .arr svg{width:14px;height:14px;}
  .agente-trigger.open{border-color:var(--accent);}
  .agente-trigger.open .arr{transform:rotate(180deg);}
  .agente-dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:100;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 20px rgba(6,182,212,.2);width:340px;max-height:440px;overflow-y:auto;padding:8px;animation:dropIn .15s ease;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .agente-dropdown .grp{font-size:calc(10px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:10px 12px 6px;font-weight:700;}
  .agente-dropdown .opt{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.12s;}
  .agente-dropdown .opt:hover{background:var(--surface2);}
  .agente-dropdown .opt.on{background:var(--accent-soft);}
  .agente-dropdown .opt .info{flex:1;min-width:0;}
  .agente-dropdown .opt b{font-size:calc(12.5px * var(--font-scale));display:block;margin-bottom:2px;color:var(--text);}
  .agente-dropdown .opt span{font-size:calc(11px * var(--font-scale));color:var(--text2);line-height:1.35;display:block;}
  .agente-dropdown .opt .tick{margin-left:auto;color:var(--accent2);align-self:center;flex-shrink:0;}
  .agente-dropdown .opt .tick svg{width:14px;height:14px;}

  .chat-body{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .chat-msg{display:flex;gap:10px;align-items:flex-start;}
  .chat-msg.me{flex-direction:row-reverse;}
  .chat-msg .bubble{max-width:70%;padding:10px 14px;border-radius:12px;font-size:calc(13px * var(--font-scale));line-height:1.45;word-wrap:break-word;position:relative;}
  .chat-msg.me .bubble{background:var(--accent);color:#062b31;border-bottom-right-radius:4px;font-weight:500;}
  .chat-msg.ai .bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;font-size:calc(12.5px * var(--font-scale));}
  .chat-msg .who{font-size:calc(10px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px;font-weight:700;}
  .chat-msg.ai .who{color:var(--accent2);font-family:var(--mono);}

  .chat-tabs{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid var(--border);}
  .chat-tab{padding:5px 11px;font-size:calc(11px * var(--font-scale));font-weight:600;color:var(--text2);border-radius:6px 6px 0 0;background:transparent;border:none;cursor:pointer;transition:.15s;}
  .chat-tab:hover{color:var(--text);background:var(--surface3);}
  .chat-tab.on{color:var(--accent2);background:var(--surface3);}
  .chat-tab .cnt{display:inline-block;background:var(--accent);color:#062b31;font-size:calc(9px * var(--font-scale));padding:0 5px;border-radius:8px;margin-left:4px;font-family:var(--mono);}
  .chat-tab-body{font-family:var(--sans);font-size:calc(13px * var(--font-scale));line-height:1.55;color:var(--text);word-wrap:break-word;}
  .chat-tab-body strong{color:var(--text);font-weight:700;}
  .chat-tab-body em{font-style:italic;}
  .chat-tab-body p{margin:0 0 8px;}
  .chat-tab-body ul{margin:6px 0 10px 18px;padding:0;}
  .chat-tab-body li{margin-bottom:4px;}
  .chat-tab-body .fuente{margin-bottom:6px;padding:6px 10px;background:var(--bg);border-radius:6px;border-left:2px solid var(--accent);}
  .chat-tab-body .fuente b{color:var(--accent2);font-family:var(--mono);font-size:calc(10.5px * var(--font-scale));}
  .chat-tab-body .fuente .prev{color:var(--text2);margin-top:3px;font-size:calc(11px * var(--font-scale));font-family:var(--sans);}

  .chat-msg .cursor-blink{display:inline-block;width:6px;height:12px;background:var(--accent2);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite;}
  @keyframes blink{0%,50%{opacity:1;}50.01%,100%{opacity:0;}}
  .chat-msg .add-report{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;border-radius:14px;font-size:calc(10.5px * var(--font-scale));font-weight:600;background:transparent;color:var(--text2);border:1px solid var(--border);transition:.15s;font-family:var(--sans);}
  .chat-msg .add-report:hover{border-color:var(--accent);color:var(--accent2);background:var(--accent-soft);}
  .chat-msg .add-report.on{background:var(--accent);color:#062b31;border-color:var(--accent);}
  .chat-msg .add-report svg{width:10px;height:10px;}

  .chat-input-wrap{padding:14px 18px;border-top:1px solid var(--border);background:var(--surface2);}
  .suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
  .suggestion-chip{padding:6px 12px;border-radius:16px;font-size:calc(11.5px * var(--font-scale));background:var(--surface);border:1px solid var(--border);color:var(--text2);transition:.15s;text-align:left;}
  .suggestion-chip:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px);}
  .suggestion-chip.pinned{border-color:var(--accent2);color:var(--accent2);}
  .suggestion-chip .tag{font-size:calc(9px * var(--font-scale));color:var(--text3);margin-left:5px;font-family:var(--mono);}
  .suggestion-loading{padding:6px 12px;border-radius:16px;font-size:calc(11.5px * var(--font-scale));background:var(--surface3);color:var(--text3);display:inline-flex;align-items:center;gap:8px;}
  .chat-input-row{display:flex;gap:10px;align-items:flex-end;}
  .chat-input-row textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:calc(13px * var(--font-scale));resize:none;outline:none;min-height:44px;max-height:140px;font-family:var(--sans);line-height:1.45;}
  .chat-input-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .chat-send{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#062b31;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-send:hover{filter:brightness(1.08);}
  .chat-send:disabled{opacity:.4;cursor:default;filter:none;}
  .chat-send svg{width:18px;height:18px;}

  .agent-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;background:var(--surface2);cursor:pointer;transition:.15s;position:relative;}
  .agent-card:hover{border-color:var(--border2);}
  .agent-card.sel{border-color:var(--accent);background:var(--accent-soft);}
  .agent-card .top{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .agent-card b{font-size:calc(12.5px * var(--font-scale));}
  .agent-card .ola{font-size:calc(9.5px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:.8px;}
  .agent-card p{margin:0;font-size:calc(11px * var(--font-scale));color:var(--text2);line-height:1.45;}
  .agent-card .st{position:absolute;top:11px;right:11px;}
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;}
  .int-tag{font-size:calc(8.5px * var(--font-scale));background:var(--purple);color:#fff;border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:.5px;}
  .agent-badge{font-family:var(--mono);font-size:calc(10.5px * var(--font-scale));font-weight:600;letter-spacing:1px;padding:4px 7px;border-radius:6px;border:1px solid currentColor;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;min-width:42px;text-align:center;color:var(--accent2);line-height:1;}

  .run-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:calc(13px * var(--font-scale));}
  .run-row:last-child{border-bottom:none;}
  .run-row .nm{width:180px;flex-shrink:0;font-weight:600;font-size:calc(12.5px * var(--font-scale));display:flex;align-items:center;gap:9px;}
  .run-row .bar{flex:1;}
  .run-row .st{width:170px;text-align:right;font-size:calc(11.5px * var(--font-scale));color:var(--text3);flex-shrink:0;}
  .spin{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:inline-block;vertical-align:-2px;}
  @keyframes rot{to{transform:rotate(360deg);}}

  .tab-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:7px 15px;border-radius:20px;font-size:calc(12.5px * var(--font-scale));font-weight:600;color:var(--text2);border:1px solid var(--border);background:var(--surface2);transition:.15s;}
  .tab:hover{color:var(--text);border-color:var(--border2);}
  .tab.on{background:var(--accent);color:#062b31;border-color:var(--accent);}
  .sig-row{display:flex;gap:13px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:9px;background:var(--surface2);cursor:pointer;transition:.15s;align-items:flex-start;}
  .sig-row:hover{border-color:var(--border2);transform:translateX(2px);}
  .sig-row .sev{width:4px;border-radius:3px;align-self:stretch;flex-shrink:0;}
  .sig-row b{font-size:calc(13px * var(--font-scale));display:block;margin-bottom:2px;}
  .sig-row p{margin:0;font-size:calc(12px * var(--font-scale));color:var(--text2);line-height:1.5;}
  .sig-row .meta{margin-left:auto;text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
  .ready-ring{display:flex;align-items:center;gap:18px;}
  .ring{position:relative;width:96px;height:96px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(22px * var(--font-scale));font-weight:600;}
  .ring .num small{font-size:calc(9px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;}

  .score-guide{background:var(--surface3);padding:10px 14px;border-radius:8px;font-size:calc(11.5px * var(--font-scale));color:var(--text2);margin-bottom:14px;border-left:3px solid var(--accent);}
  .score-guide b{color:var(--accent2);}

  .informe-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 180px);}
  .informe-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
  .informe-panel-head{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:10px;}
  .informe-panel-head b{font-size:calc(14px * var(--font-scale));}
  .informe-panel-head .actions{margin-left:auto;display:flex;gap:6px;}
  .informe-panel-body{flex:1;overflow-y:auto;padding:16px 18px;}
  .item-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface2);transition:.15s;position:relative;}
  .item-card.excluded{opacity:.45;}
  .item-card:hover{border-color:var(--border2);}
  .item-card .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .item-card .head b{font-size:calc(12.5px * var(--font-scale));}
  .item-card .type{font-size:calc(9.5px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);}
  .item-card .content{font-size:calc(11.5px * var(--font-scale));color:var(--text2);line-height:1.5;max-height:60px;overflow:hidden;text-overflow:ellipsis;}
  .item-card .toggle{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;}
  .item-card:not(.excluded) .toggle{background:var(--accent);border-color:var(--accent);color:#062b31;}
  .item-card:not(.excluded) .toggle svg{width:12px;height:12px;}
  .item-card .exclude-btn{position:absolute;bottom:10px;right:11px;font-size:calc(10.5px * var(--font-scale));color:var(--text3);padding:3px 8px;border-radius:6px;border:1px solid var(--border);}
  .item-card .exclude-btn:hover{color:var(--text);}
  .preview-content{font-family:Georgia,serif;font-size:calc(12.5px * var(--font-scale));line-height:1.6;color:var(--text2);}
  .preview-content h1{font-size:calc(17px * var(--font-scale));margin:0 0 6px;color:var(--text);}
  .preview-content h2{font-size:calc(14px * var(--font-scale));margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);color:var(--text);}
  .preview-content h3{font-size:calc(12.5px * var(--font-scale));margin:12px 0 6px;color:var(--text);}
  .preview-content h4{font-size:calc(11px * var(--font-scale));margin:10px 0 4px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
  .preview-content ul{margin:5px 0 8px 20px;padding:0;}
  .preview-content li{margin-bottom:4px;}
  .preview-score{display:flex;align-items:center;gap:10px;margin:8px 0;padding:8px 12px;background:var(--surface3);border-radius:6px;}
  .preview-score .num{font-size:calc(22px * var(--font-scale));font-weight:700;font-family:var(--mono);}
  .preview-score .txt{font-size:calc(11px * var(--font-scale));color:var(--text2);line-height:1.4;}

  .soon{padding:60px 24px;text-align:center;}
  .soon .ic{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
  .soon .ic svg{width:30px;height:30px;color:var(--text3);}
  .soon h2{margin:0 0 8px;font-size:calc(22px * var(--font-scale));}
  .soon p{margin:0 auto;font-size:calc(14px * var(--font-scale));color:var(--text2);max-width:520px;line-height:1.6;}
  .soon .pill{background:#C77DFF22;color:var(--purple);margin-bottom:14px;padding:4px 12px;font-size:calc(11px * var(--font-scale));letter-spacing:1px;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:12px 20px;font-size:calc(13px * var(--font-scale));font-weight:600;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;animation:fade .2s ease;}
  .toast.err{border-color:var(--crit);}

  [data-tip]{cursor:help;}
  .matrix-tip{position:fixed;z-index:9999;max-width:290px;padding:10px 13px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;font-size:calc(11.5px * var(--font-scale));line-height:1.5;color:var(--text);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 16px rgba(6,182,212,.2);}
  .matrix-tip.on{opacity:1;transform:translateY(0);}
  .matrix-tip b{color:var(--accent2);font-weight:600;display:block;margin-bottom:4px;font-family:var(--mono);font-size:calc(11px * var(--font-scale));letter-spacing:.4px;}

  @media (max-width:960px){
    .app{grid-template-columns:70px 1fr;}
    .sidebar .brand h1,.sidebar .brand p,.nav-item span,.nav-label,.sidebar-foot .nm,.sidebar-foot .rl{display:none;}
    .informe-layout{grid-template-columns:1fr;}
    .agente-dropdown{width:280px;}
    .chat-msg .bubble{max-width:85%;}
  }
  /* ---- Módulos incrustados (Dashboard / Memoria Anual) ---- */
  .content.flush{padding:0;overflow:hidden;display:flex;flex-direction:column;}
  .content.flush .view{max-width:none;margin:0;flex:1;display:flex;min-height:0;animation:none;}
  .mod-frame{flex:1;width:100%;border:0;display:block;background:transparent;}
  .view-pad{padding:26px 30px;max-width:640px;}
  /* ---- Accesibilidad ---- */
  a.nav-item{text-decoration:none;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px;}
  .chat-input-row textarea:focus-visible{outline:none;}
  [role="button"][tabindex]{cursor:pointer;}
  code{font-family:var(--mono);font-size:.92em;background:var(--surface3);padding:1px 6px;border-radius:5px;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

  /* ---- Grillas ---- */
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  .grid.g-score{grid-template-columns:auto 1fr;}
  .big-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .big-ic svg{width:22px;height:22px;}
  .ic-alert{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface3);color:var(--med);}
  .ic-alert svg{width:20px;height:20px;}
  .aviso-err{margin-bottom:18px;border-color:var(--crit);background:linear-gradient(135deg,#FF2D5514,transparent 60%);}
  .aviso-err .ic-alert{color:var(--crit);}
  .aviso-warn{border-color:var(--med);background:linear-gradient(135deg,#F4A26118,transparent 60%);}
  .doc-activo-txt{flex:1;min-width:0;font-size:calc(11.5px * var(--font-scale));color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-row .icon-btn:disabled{opacity:.35;cursor:default;}

  /* ---- Resultados ---- */
  .res-txt{font-size:calc(12px * var(--font-scale));color:var(--text2);line-height:1.5;}
  .res-txt p{margin:0 0 4px;}
  .res-txt ul,.res-txt ol{margin:4px 0 6px 18px;padding:0;}
  .filtros{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .sel{margin-left:auto;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:calc(12.5px * var(--font-scale));max-width:220px;}
  details.det{margin-bottom:14px;padding:0;}
  details.det > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;border-radius:var(--radius);}
  details.det > summary::-webkit-details-marker{display:none;}
  details.det > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);transform:rotate(45deg);margin:0 4px 4px 6px;transition:.2s;flex-shrink:0;}
  details.det[open] > summary::after{transform:rotate(225deg);margin-bottom:-2px;}
  details.det[open] > summary{border-bottom:1px solid var(--border);border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .det-counts{font-size:calc(11px * var(--font-scale));color:var(--text3);font-family:var(--mono);white-space:nowrap;}
  .score-num{font-size:calc(26px * var(--font-scale));font-weight:700;font-family:var(--mono);line-height:1;}
  .score-lbl{font-size:calc(10px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
  .det-body{padding:8px 20px 18px;}
  .det-blk h4{margin:14px 0 6px;font-size:calc(11px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;}
  .det-it{padding:8px 0;border-bottom:1px dashed var(--border);font-size:calc(12.5px * var(--font-scale));}
  .det-it:last-child{border-bottom:none;}
  .det-it p{margin:3px 0 0;color:var(--text2);line-height:1.5;}
  .link-btn{color:var(--accent2);font-size:calc(11.5px * var(--font-scale));font-weight:600;padding:2px 4px;border-radius:4px;}
  .link-btn:hover{text-decoration:underline;}

  /* ---- Modal ---- */
  .modal-back{position:fixed;inset:0;background:rgba(3,3,10,.66);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.55);}
  .modal-head{display:flex;align-items:center;margin-bottom:6px;}
  .modal-head h3{margin:0;font-size:calc(17px * var(--font-scale));flex:1;}
  .icon-btn-x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);}
  .icon-btn-x:hover{color:var(--text);background:var(--surface2);}
  .icon-btn-x svg{width:16px;height:16px;}
  .modal-actions-top{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .modal-body{overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px 8px;background:var(--surface2);min-height:120px;}
  .modal .grp{font-size:calc(10px * var(--font-scale));color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:10px 4px 4px;font-weight:700;}
  .chk-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:calc(13px * var(--font-scale));}
  .chk-row:hover{background:var(--surface3);}
  .chk-row input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;}
  .mini-st{font-size:calc(10.5px * var(--font-scale));font-weight:600;}
  .modal-foot{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}

  /* ---- Responsive ---- */
  @media (max-width:1100px){
    .grid.g4{grid-template-columns:repeat(2,1fr);}
    .grid.g-score{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .content{padding:18px 14px 50px;}
    .topbar{padding:0 12px;}
    .bg-banner{right:10px;left:10px;top:70px;}
    .doc-row{flex-wrap:wrap;}
    .doc-row .info{flex-basis:calc(100% - 60px);}
    .doc-row .actions{width:100%;justify-content:flex-end;}
    .checklist-step{flex-wrap:wrap;}
    .sig-row{flex-wrap:wrap;}
    .sig-row .meta{margin-left:17px;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;}
    .kv{flex-direction:column;gap:2px;}
    .kv .k{width:auto;}
    .det-counts{display:none;}
    .sel{margin-left:0;max-width:100%;}
    .informe-layout{height:auto;}
    .informe-panel{max-height:70vh;}
    .chat-wrap{height:calc(100vh - 130px);}
    .chat-msg .bubble{max-width:92%!important;}
  }

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="iso"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#062b31" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="#062b31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><h1>DIRECTA</h1><p>Gerencia General</p></div>
    </div>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-foot">
      <div class="profile">
        <div class="avatar">GG</div>
        <div><div class="nm">Gerente General</div><div class="rl">Sesión activa</div></div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="tb-right">
        <button class="tb-btn text-btn" onclick="cambiarFuente(-1)" aria-label="Reducir tamaño de letra" data-tip="A-::Reduce el tamaño de la letra.">A-</button>
        <button class="tb-btn text-btn" onclick="resetFuente()" aria-label="Tamaño de letra normal" data-tip="A::Vuelve al tamaño normal.">A</button>
        <button class="tb-btn text-btn" onclick="cambiarFuente(1)" aria-label="Aumentar tamaño de letra" data-tip="A+::Aumenta el tamaño de la letra.">A+</button>
        <button class="tb-btn" id="themeBtn" aria-label="Cambiar tema claro u oscuro" data-tip="Tema::Cambia entre modo claro y oscuro." onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="content"><div class="view" id="view"></div></div>
    <div id="bannerRoot"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   CONFIGURACIÓN
   La URL del backend se puede cambiar sin editar este archivo:
     - definiendo  window.DIRECTA_API = "https://mi-servidor"  antes de este script, o
     - abriendo la página con  ?api=https://mi-servidor
   ========================================================================== */
const API = (window.DIRECTA_API || new URLSearchParams(location.search).get("api") || "http://localhost:8000").replace(/\/+$/, "");

const LS = {
  font: "directa_font_scale",
  theme: "directa_theme",
  informe: "directa_informe_v2",
  chats: "directa_chats_v2",
  doc: "directa_doc_activo",
};

/* Almacenamiento local seguro (puede estar bloqueado en modo privado) */
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : v; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsGetJSON(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSetJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ==========================================================================
   AGENTES  (ola/tipo se actualizan desde /api/agentes si el backend responde)
   ========================================================================== */
const AGENTS = [
  {id:"fin", key:"financiero",     name:"Financiero",            badge:"FIN", tipo:"productor",  ola:1, desc:"Márgenes, liquidez, covenants, calidad de resultados y disciplina presupuestaria."},
  {id:"cyb", key:"ciberseguridad", name:"Ciberseguridad",        badge:"CYB", tipo:"productor",  ola:1, desc:"Postura de seguridad, incidentes, hallazgos de pentest y cumplimiento normativo."},
  {id:"aud", key:"auditoria",      name:"Auditoría",             badge:"AUD", tipo:"productor",  ola:2, desc:"Hallazgos de auditoría interna/externa, provisiones y controles internos."},
  {id:"leg", key:"legal",          name:"Legal",                 badge:"LEG", tipo:"productor",  ola:2, desc:"Contingencias legales, litigios, cumplimiento regulatorio y contratos relevantes."},

function newId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  const b = new Uint8Array(16);
  try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256); }
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

}

/* ==========================================================================

   ========================================================================== */
function inlineMd(t){
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>");
  return t;
}
function renderMarkdownLigero(texto){
  if(!texto) return "";
  const lines = esc(String(texto)).split("\n");
  const out = [];
  let lista = null; // "ul" | "ol"
  const cerrar = () => { if(lista){ out.push(`</${lista}>`); lista = null; } };
  for(const line of lines){
    const t = line.trim();
    let m;
    if((m = t.match(/^(?:[-•*])\s+(.*)$/))){
      if(lista !== "ul"){ cerrar(); out.push("<ul>"); lista = "ul"; }
      out.push("<li>" + inlineMd(m[1]) + "</li>");
    } else if((m = t.match(/^\d+[.)]\s+(.*)$/))){
      if(lista !== "ol"){ cerrar(); out.push("<ol>"); lista = "ol"; }
      out.push("<li>" + inlineMd(m[1]) + "</li>");
    } else {
      cerrar();
      if(t) out.push("<p>" + inlineMd(t) + "</p>");
    }
  }
  cerrar();
  return out.join("");
}

function renderProgresoHTML(p, nombre){
  if(!p) return "";
  const pct = p.total ? Math.round(100 * p.procesados / p.total) : 3;
  const restante = p.estimado_seg || 0;
  const radio = 24, circ = 2 * Math.PI * radio, offset = circ * (1 - pct / 100);
  return `
    <div class="progress-circular" role="status">
      <div class="circular-wrap">
        <svg width="56" height="56" aria-hidden="true">
          <circle cx="28" cy="28" r="${radio}" stroke="var(--surface3)" stroke-width="4" fill="none"/>
          <circle id="circularProgress" cx="28" cy="28" r="${radio}" stroke="var(--accent)" stroke-width="4" fill="none"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
            style="transition:stroke-dashoffset 0.3s ease;"/>
        </svg>
        <div class="circular-pct" id="circularPct">${pct}%</div>
      </div>
      <div class="circular-info">
        <b>${esc(nombre)}</b>
        <span id="progEstado">${esc(_faseLabel(p))}</span>
      </div>
      <div class="circular-time" id="progTiempo">${restante > 0 ? "~" + formatTiempo(restante) : "…"}</div>

  const pct = p.total > 0 ? Math.round(100 * (p.procesados || 0) / p.total) : 3;

  return `
  <div class="page-head">
    <div>
      <h2>Documentos</h2>
      <p>Sube un PDF, Word o Excel. Se indexa y analiza con los ${state.totalAgentes} agentes automáticamente. Cuando termine, podrás consultarlo.</p>
    </div>
  </div>
  ${avisoBackend()}
  <div class="card" style="margin-bottom:18px;">
    <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.xlsx,.xls" style="display:none" onchange="subirArchivo(this.files[0]); this.value='';">
    <div class="upload-zone" id="uploadZone" role="button" tabindex="0"
         onclick="document.getElementById('fileInput').click()"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('fileInput').click()}"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');subirArchivo(event.dataTransfer.files[0])">
      <div class="ic">${IC.up}</div>
      <b>Subir un documento</b>
      <span>Arrastra el archivo aquí o haz clic · PDF, Word o Excel · análisis automático al terminar la indexación</span>
    </div>
    <div id="progressZone">
      ${state.subiendo && state.progreso ? renderProgresoHTML(state.progreso, state.subiendoNombre) : ""}
    </div>
  </div>

  <div class="card">
    <div class="sec-title">Documentos cargados (${nDocs})</div>
    ${nDocs === 0 ? `
      <div class="empty">
        <div class="ic">${IC.docs}</div>
        <h3>Aún no hay documentos</h3>
        <p>Sube el primer archivo para empezar. Se indexará y analizará automáticamente.</p>
      </div>
    ` : state.documentos.map(docRow).join("")}
  </div>`;
}

const ESTADOS_PROCESANDO = ["Procesando", "Analizando", "Iniciando"];
function docRow(d){
  const colores = {
    "Listo":"var(--low)", "Listo con errores":"var(--med)", "Analizando":"var(--accent2)",
    "Procesando":"var(--accent2)", "Iniciando":"var(--accent2)", "Error":"var(--crit)"
  };
  const color = colores[d.estado] || "var(--text3)";
  const activo = state.docActivo === d.id;
  const nAn = d.analisis_count || 0, T = state.totalAgentes;
  const ext = ((d.nombre_archivo || d.titulo || "").split(".").pop() || "").toUpperCase().slice(0, 4) || "DOC";
  const procesando = ESTADOS_PROCESANDO.includes(d.estado);
  const incompleto = !procesando && d.estado !== "Error" && nAn < T;
  return `
  <div class="doc-row" style="${activo ? "border-color:var(--accent);background:var(--accent-soft);" : ""}">
    <div class="ic">${esc(ext)}</div>
    <div class="info">
      <b>${esc(d.titulo || d.nombre_archivo || "(sin título)")}</b>
      <div class="meta">${d.total_paginas ?? "?"} páginas · ${d.chunks ?? 0} fragmentos · ${nAn}/${T} agentes${activo ? " · <span style='color:var(--accent2)'>activo</span>" : ""}${incompleto ? " · <span style='color:var(--med)'>análisis incompleto</span>" : ""}</div>
    </div>
    <div class="status">
      <span class="pill" style="background:${color}22;color:${color};">
        <span class="dot" style="background:${color}"></span>${esc(d.estado || "—")}
      </span>
    </div>
    <div class="actions">
      <button class="icon-btn" data-tip="Activar::Marcar este documento como activo." onclick="activarDocumento(${arg(d.id)})">${IC.check}</button>
      <button class="icon-btn" data-tip="Preguntar::Ir al chat con este documento." onclick="irAChat(${arg(d.id)})">${IC.chat}</button>
      <button class="icon-btn" data-tip="Resultados::Ver el análisis de los agentes." onclick="irAResultados(${arg(d.id)})">${IC.chart}</button>
      <button class="icon-btn danger" data-tip="Eliminar::Borra el documento, sus fragmentos y sus análisis." onclick="eliminarDocumento(${arg(d.id)})">${IC.trash}</button>
    </div>
  </div>`;
}

/* ---------------------------------- chat ---------------------------------- */
function opcionAgente(a){
  return `
    <div class="opt ${state.agenteActual === a.key ? "on" : ""}" role="option" tabindex="0" onclick="cambiarAgente(${arg(a.key)})" onkeydown="if(event.key==='Enter'){cambiarAgente(${arg(a.key)})}">
      <span class="agent-badge" style="font-size:calc(9px * var(--font-scale));min-width:38px;">${a.badge}</span>
      <div class="info"><b>${esc(a.name)}</b><span>${esc(a.desc)}</span></div>
      ${state.agenteActual === a.key ? `<span class="tick">${IC.check}</span>` : ""}
    </div>`;
}

function burbujaIA(m){
  const inReport = state.informeItems.some(it => it.tipo === "chat" && it.msgId === m.id);
  const tieneFuentes = m.fuentes && m.fuentes.length > 0;
  const tabActual = state.tabActivaChat[m.id] || "respuesta";
  let cuerpo;
  if(tabActual === "fuentes" && tieneFuentes){
    cuerpo = m.fuentes.map((f, i) => `
      <div class="fuente">
        <b>[${i+1}] Página ${esc(f.pagina)}</b>
        <span style="color:var(--text3);font-size:calc(10.5px * var(--font-scale));margin-left:6px;">similitud ${esc(f.similarity)}</span>
        <div class="prev">${esc(f.preview)}</div>
      </div>`).join("");
  } else if(m.streaming){
    cuerpo = m.texto
      ? `<span id="txt_${m.id}">${esc(m.texto)}</span><span class="cursor-blink"></span>`
      : `<span id="txt_${m.id}" style="color:var(--text3);"><span class="spin"></span> Analizando el documento…</span>`;
  } else if(m.error){
    cuerpo = `<span id="txt_${m.id}" style="color:var(--high);">${esc(m.texto)}</span>`;
  } else {
    cuerpo = `<span id="txt_${m.id}">${renderMarkdownLigero(m.texto)}</span>`;
  }
  return `
    <div class="chat-msg ai">
      <div class="bubble" style="max-width:80%;">
        <div class="who">&gt; ${esc(m.agente || "Asistente")}</div>
        ${tieneFuentes && !m.streaming ? `
          <div class="chat-tabs">
            <button class="chat-tab ${tabActual === "respuesta" ? "on" : ""}" onclick="cambiarTabChat(${arg(m.id)},'respuesta')">Respuesta</button>
            <button class="chat-tab ${tabActual === "fuentes" ? "on" : ""}" onclick="cambiarTabChat(${arg(m.id)},'fuentes')">Fuentes <span class="cnt">${m.fuentes.length}</span></button>
          </div>` : ""}
        <div class="chat-tab-body">${cuerpo}</div>
        ${!m.streaming && !m.error ? `
          <button class="add-report ${inReport ? "on" : ""}" onclick="toggleChatEnInforme(${arg(m.id)})">
            ${inReport ? IC.check + " En el informe" : IC.plus + " Agregar al informe"}
          </button>` : ""}
      </div>
    </div>`;
}

function vChat(){
  const ag = agentByKey(state.agenteActual);
  const esGeneral = state.agenteActual === "general" || !ag;
  const docActivo = state.documentos.find(d => d.id === state.docActivo);
  const productores = AGENTS.filter(a => a.tipo === "productor");
  const integradores = AGENTS.filter(a => a.tipo === "integrador");

  const dropdown = state.agenteDropdownAbierto ? `
    <div class="agente-dropdown" role="listbox" onclick="event.stopPropagation()">
      <div class="grp">General</div>
      <div class="opt ${esGeneral ? "on" : ""}" role="option" tabindex="0" onclick="cambiarAgente('general')" onkeydown="if(event.key==='Enter'){cambiarAgente('general')}">
        <span class="agent-badge" style="font-size:calc(9px * var(--font-scale));min-width:38px;">GEN</span>
        <div class="info"><b>Asistente general</b><span>Consultas generales sobre cualquier documento.</span></div>
        ${esGeneral ? `<span class="tick">${IC.check}</span>` : ""}
      </div>
      <div class="grp">Integradores</div>
      ${integradores.map(opcionAgente).join("")}
      <div class="grp">Especialistas</div>
      ${productores.map(opcionAgente).join("")}
    </div>` : "";

  const mensajesHtml = state.mensajes.length === 0 ? `
    <div class="empty" style="margin:auto;">
      <div class="ic">${IC.chat}</div>
      <h3>Empieza la conversación</h3>
      <p>Escribe una pregunta sobre el documento activo o usa una de las sugerencias. Las repreguntas ("¿y por qué?") se entienden en contexto.</p>
    </div>
  ` : state.mensajes.map(m => m.rol === "me"
      ? `<div class="chat-msg me"><div class="bubble">${esc(m.texto)}</div></div>`
      : burbujaIA(m)).join("");

  const fija = `<button class="suggestion-chip pinned" onclick="usarSugerencia(-1)" data-tip="Fija::Pregunta general sobre el documento.">¿De qué trata el documento? <span class="tag">FIJA</span></button>`;
  const sugerenciasHtml = state.cargandoSugerencias
    ? `<div class="suggestion-loading"><span class="spin"></span> Buscando sugerencias…</div>`
    : `<div class="suggestions">
        ${state.sugerencias.map((s, i) => `
          <button class="suggestion-chip" onclick="usarSugerencia(${i})" data-tip="Sugerencia::Haz clic para escribir esta pregunta.">${esc(s)} <span class="tag">SUG</span></button>`).join("")}
        ${fija}
      </div>`;

  return `
  <div class="page-head">
    <div>
      <h2>Preguntar a la IA</h2>
      <p>Consulta los hallazgos ya generados por los agentes. Selecciona el agente que quieras usar desde el selector.</p>
    </div>
  </div>
  ${avisoBackend()}
  ${!docActivo && state.documentos.length > 0 ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--med);background:linear-gradient(135deg,#F4A26122,transparent 60%);">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div style="flex:1;font-size:calc(13px * var(--font-scale));min-width:200px;"><b>Selecciona un documento activo.</b> Ve a <b>Documentos</b> y haz clic en el check del archivo.</div>
        <button class="btn ghost" onclick="go('docs')">${IC.docs} Ir a Documentos</button>
      </div>
    </div>` : ""}
  <div class="chat-wrap">
    <div class="chat-topbar">
      <div class="agente-selector">
        <button class="agente-trigger ${state.agenteDropdownAbierto ? "open" : ""}" aria-haspopup="listbox" aria-expanded="${state.agenteDropdownAbierto}" onclick="toggleAgenteDropdown(event)">
          <span class="agent-badge" style="font-size:calc(9px * var(--font-scale));min-width:36px;">${esGeneral ? "GEN" : ag.badge}</span>
          <span>${esc(esGeneral ? "Asistente general" : ag.name)}</span>
          <span class="arr">${IC.chevron}</span>
        </button>
        ${dropdown}
      </div>
      <div class="doc-activo-txt">
        ${docActivo ? "Documento: " + esc(docActivo.titulo || docActivo.nombre_archivo) : "Sin documento activo"}
      </div>
      <button class="btn ghost sm" onclick="nuevaConversacion()" ${state.mensajes.length === 0 || state.consultando ? "disabled" : ""} data-tip="Nueva conversación::Borra el chat de este documento (lo ya agregado al informe se conserva).">${IC.plus} Nueva</button>
      <button class="btn ghost sm" onclick="refrescarSugerencias()" data-tip="Nuevas sugerencias::Recarga las sugerencias desde el análisis guardado.">${IC.refresh} Sugerencias</button>
    </div>
    <div class="chat-body" id="chatBody" role="log" aria-live="polite">
      ${mensajesHtml}
    </div>
    <div class="chat-input-wrap">
      ${sugerenciasHtml}
      <div class="chat-input-row">
        <textarea id="chatInput" aria-label="Escribe tu pregunta" placeholder="Escribe tu pregunta… (Enter envía, Shift+Enter salto de línea)" rows="1"
          oninput="state.borrador=this.value;autoTamano(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();enviarPregunta();}">${esc(state.borrador)}</textarea>
        <button class="chat-send" aria-label="Enviar pregunta" onclick="enviarPregunta()" ${state.consultando || !docActivo ? "disabled" : ""}>${IC.send}</button>
      </div>
    </div>
  </div>`;
}
function autoTamano(el){ el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; }

function cambiarTabChat(msgId, tab){ state.tabActivaChat[msgId] = tab; render(); }
function toggleAgenteDropdown(e){ e.stopPropagation(); state.agenteDropdownAbierto = !state.agenteDropdownAbierto; render(); }
document.addEventListener("click", () => { if(state.agenteDropdownAbierto){ state.agenteDropdownAbierto = false; render(); } });
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(state.agenteDropdownAbierto){ state.agenteDropdownAbierto = false; render(); }
});

function cambiarAgente(key){
  state.agenteDropdownAbierto = false;
  if(state.agenteActual === key){ render(); return; }
  state.agenteActual = key;
  state.sugerencias = [];
  render();
  if(state.docActivo) cargarSugerencias();
}
function usarSugerencia(idx){
  state.borrador = idx === -1 ? "¿De qué trata el documento?" : (state.sugerencias[idx] || "");
  const input = document.getElementById("chatInput");
  if(input){ input.value = state.borrador; autoTamano(input); input.focus(); }
}
function refrescarSugerencias(){
  if(state.docActivo) delete state.sugerenciasCache[`${state.docActivo}::${state.agenteActual}`];
  state.sugerencias = [];
  render();
  if(state.docActivo) cargarSugerencias();
}
function nuevaConversacion(){
  if(!confirm("¿Borrar la conversación de este documento?")) return;
  state.mensajes = [];
  state.tabActivaChat = {};
  guardarChat();
  render();
}
function preguntarEnChat(agenteKey, texto){
  if(agentByKey(agenteKey)) state.agenteActual = agenteKey;
  state.borrador = texto;
  state.sugerencias = [];
  go("chat");
  if(state.docActivo) cargarSugerencias();
}

/* ------------------------------- resultados ------------------------------- */
function conteoSeveridad(res){
  const c = {"crítica":0, "alta":0, "media":0, "baja":0};
  Object.values(res).forEach(r => senalesDe(r).forEach(s => { c[normSev(s.severidad)]++; }));
  return c;
}

function scoreGlobalDe(res){
  const conInfo = Object.values(res).filter(tieneInfo);
  if(!conInfo.length) return {score:0, n:0, sinInfo:Object.keys(res).length};
  const media = Math.round(conInfo.reduce((a, r) => a + (Number(r.score) || 0), 0) / conInfo.length);
  return {score:media, n:conInfo.length, sinInfo:Object.keys(res).length - conInfo.length};
}

function listaDetalle(titulo, items, render){
  if(!items || !items.length) return "";
  return `<div class="det-blk"><h4>${titulo} (${items.length})</h4>${items.map(render).join("")}</div>`;
}

function tarjetaAgente(k, r){
  const si = scoreInfo(r.score);
  const abierto = state.abiertos.has(k);
  const enInforme = state.informeItems.some(it => it.tipo === "analisis" && it.agente_key === k && it.document_id === state.docActivo);
  const sens = senalesDe(r);
  return `
    <details class="card det" ${abierto ? "open" : ""} ontoggle="toggleDet(${arg(k)}, this.open)">
      <summary>
        <span class="agent-badge">${esc(badgeAgente(k))}</span>
        <div style="flex:1;min-width:0;">
          <b style="font-size:calc(14px * var(--font-scale));">${esc(nombreAgente(k))}</b>
          <div style="font-size:calc(11.5px * var(--font-scale));color:${si.col};font-weight:600;">${si.label}</div>
        </div>
        <div class="det-counts">${(r.hallazgos||[]).length} hallaz. · ${sens.length} señales · ${(r.omisiones||[]).length} omis.</div>
        <div style="text-align:right;">
          <div class="score-num" style="color:${si.col};">${Number(r.score) || 0}</div>
          <div class="score-lbl">Score</div>
        </div>
      </summary>
      <div class="det-body">
        <div class="kv"><div class="k">Resumen</div><div>${renderMarkdownLigero(r.resumen_ejecutivo || "—")}</div></div>
        ${listaDetalle("Hallazgos", r.hallazgos, h => `<div class="det-it"><b>${esc(h.titulo || "")}</b><p>${esc(h.descripcion || "")}</p></div>`)}
        ${listaDetalle("Señales", sens, s => { const sv = normSev(s.severidad); return `<div class="det-it"><span class="pill" style="background:${SEV_COL[sv]}22;color:${SEV_COL[sv]}">${sv.toUpperCase()}</span> <b>${esc(s.titulo || "")}</b><p>${esc(s.descripcion || "")}</p></div>`; })}
        ${listaDetalle("Omisiones", r.omisiones, o => `<div class="det-it"><p>${esc(o.descripcion || o.titulo || "")}</p></div>`)}
        ${listaDetalle("Preguntas probables del directorio (para preparar la sesión)", r.preguntas, q => `<div class="det-it"><p>“${esc(q.pregunta || "")}”</p></div>`)}
        ${listaDetalle("Recomendaciones", r.recomendaciones, x => `<div class="det-it"><p>${esc(x.descripcion || x.titulo || "")}</p></div>`)}
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ghost sm" onclick="toggleAnalisisEnInforme(${arg(k)})">${enInforme ? IC.check + " En el informe (quitar)" : IC.plus + " Agregar al informe"}</button>
        </div>
      </div>
    </details>`;
}
function toggleDet(k, abierto){ if(abierto) state.abiertos.add(k); else state.abiertos.delete(k); }

function vResultados(){
  const res = state.analisis ? state.analisis.resultados : {};
  const keys = Object.keys(res).sort((a, b) => ordenAgente(a) - ordenAgente(b));
  const docActivo = state.documentos.find(d => d.id === state.docActivo);
  const T = state.totalAgentes;

  if(keys.length === 0){
    const hayDoc = !!docActivo;
    const procesando = hayDoc && ESTADOS_PROCESANDO.includes(docActivo.estado);
    return `
    <div class="page-head"><div><h2>Resultados</h2><p>Aquí aparece el resumen consolidado de los agentes sobre el documento activo.</p></div></div>
    ${avisoBackend()}
    <div class="card">
      <div class="empty">
        <div class="ic">${state.cargandoAnalisis ? '<span class="spin"></span>' : IC.chart}</div>
        <h3>${state.cargandoAnalisis ? "Cargando análisis…" : procesando ? "El documento se está procesando" : "Sin resultados todavía"}</h3>
        <p>${!hayDoc ? "Sube un documento. El análisis se ejecuta automáticamente y los resultados aparecerán aquí."
            : procesando ? "Los resultados aparecerán solos cuando termine el análisis."
            : "Este documento no tiene análisis guardados. El análisis se hace una sola vez, al subir el archivo. Si falló, elimina el documento y vuelve a subirlo."}</p>
        ${!hayDoc ? `<button class="btn" onclick="go('docs')">${IC.up} Ir a Documentos</button>` : ""}
      </div>
    </div>`;
  }

  const todasSenales = [];
  keys.forEach(k => senalesDe(res[k]).forEach(s => todasSenales.push({...s, severidad:normSev(s.severidad), agente:k})));
  const cont = conteoSeveridad(res);
  const g = scoreGlobalDe(res);
  const gi = scoreInfo(g.score);
  const C = 2 * Math.PI * 42;
  const faltan = AGENTS.filter(a => !(a.key in res)).map(a => a.key);

  const tabs = [
    {id:"consolidado", l:"Resumen consolidado"},
    {id:"senales",     l:`Señales (${todasSenales.length})`},
    {id:"omisiones",   l:"Omisiones"},
    {id:"preguntas",   l:"Preguntas probables"},
    {id:"agentes",     l:`Por agente (${keys.length})`}
  ];

  let tabBody = "";
  if(state.tabResultados === "consolidado"){
    tabBody = `
      ${faltan.length ? `
        <div class="card aviso-warn" style="margin-bottom:16px;" role="alert">
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <div class="ic-alert">${IC.alert}</div>
            <div style="flex:1;min-width:220px;font-size:calc(13px * var(--font-scale));">
              <b>Faltan ${faltan.length} agente${faltan.length > 1 ? "s" : ""} por analizar:</b> ${faltan.map(k => esc(nombreAgente(k))).join(", ")}.
              <div style="color:var(--text2);font-size:calc(12px * var(--font-scale));margin-top:2px;">No se pudieron analizar al subir el archivo. Para no gastar más IA, el análisis no se repite solo. El puntaje global solo considera los agentes que tienen resultado.</div>
            </div>
          </div>
        </div>` : ""}
      <div class="score-guide">
        <b>¿Qué significa el Score?</b> Índice 0-100 por agente. <b>90-100</b> sin observaciones · <b>75-89</b> menor atención · <b>55-74</b> requiere revisión · <b>40-54</b> observaciones serias · <b>0-39</b> críticas, no enviar aún.
        Con la configuración por defecto se calcula a partir de las señales: cada crítica resta 30, alta 15, media 6 y baja 2.
      </div>
      <div class="card">
        <div class="sec-title">Agentes con resultado</div>
        ${keys.map(k => {
          const r = res[k], si = scoreInfo(r.score);
          return `
            <div class="sig-row" style="cursor:default;">
              <div class="sev" style="background:${si.col}"></div>
              <div style="flex:1;min-width:0;">
                <b><span class="agent-badge" style="font-size:calc(9px * var(--font-scale));min-width:36px;">${esc(badgeAgente(k))}</span> ${esc(nombreAgente(k))}</b>
                <div class="res-txt">${renderMarkdownLigero(r.resumen_ejecutivo || "Sin resumen ejecutivo.")}</div>
              </div>
              <div class="meta">
                <span class="pill" style="background:${si.col}22;color:${si.col}">Score ${Number(r.score) || 0}</span>
                <span style="font-size:calc(10.5px * var(--font-scale));color:${si.col};">${si.label}</span>
              </div>
            </div>`;
        }).join("")}
      </div>`;
  }
  else if(state.tabResultados === "senales"){
    const agentesConSenal = [...new Set(todasSenales.map(s => s.agente))];
    const filtradas = todasSenales
      .filter(s => (state.filtroSev === "todas" || s.severidad === state.filtroSev) && (state.filtroAgente === "todos" || s.agente === state.filtroAgente))
      .sort((a, b) => SEV_ORDER.indexOf(a.severidad) - SEV_ORDER.indexOf(b.severidad) || ordenAgente(a.agente) - ordenAgente(b.agente));
    tabBody = `

function resumenGeneralJS(activos){
  const an = activos.filter(i => i.tipo === "analisis" && i.resultado);
  if(!an.length) return [];
  const conInfo = an.filter(i => tieneInfo(i.resultado));
  const partes = [];
  if(conInfo.length <= 2){
    partes.push(conInfo.length === 0
      ? `Ninguno de los ${an.length} agentes incluidos identificó contenido sustantivo en el documento.`
      : `Solo ${conInfo.length} de los ${an.length} agentes incluidos identificó contenido relevante para su área.`);
    return partes;
  }
  partes.push(`El documento fue evaluado por ${an.length} agentes; ${conInfo.length} identificaron hallazgos relevantes.`);
  const cont = {"crítica":0, "alta":0, "media":0, "baja":0};
  const graves = [];
  const esInteg = k => (AGENTS.find(a => a.key === k) || {}).tipo === "integrador";
  let transv = 0;
  conInfo.forEach(i => senalesDe(i.resultado).forEach(s => {
    const sv = normSev(s.severidad); cont[sv]++;
    if(esInteg(i.agente_key)) transv++;
    if((sv === "crítica" || sv === "alta") && s.titulo) graves.push({sv, k:i.agente_key, t:s.titulo});
  }));
  const total = SEV_ORDER.reduce((a, s) => a + cont[s], 0);
  if(total) partes.push(`Se levantaron ${total} señales: ` + SEV_ORDER.filter(s => cont[s]).map(s => `${cont[s]} ${SEV_LABEL[s].toLowerCase()}`).join(", ") + "." +
    (transv ? ` ${transv} de ellas son transversales (Riesgos y Estrategia cruzan hechos que otros agentes ya reportaron, por lo que pueden repetir un mismo tema).` : ""));
  graves.sort((a, b) => (SEV_ORDER.indexOf(a.sv) - SEV_ORDER.indexOf(b.sv)) || (esInteg(a.k) - esInteg(b.k)));
  if(graves.length) partes.push("Señales de mayor severidad: " + graves.slice(0, 5).map(g => `${nombreAgente(g.k)}: ${g.t} (${g.sv})`).join("; ") + ".");
  const bajos = conInfo.map(i => ({k:i.agente_key, s:Number(i.resultado.score) || 0})).filter(x => x.s < 70).sort((a, b) => a.s - b.s).slice(0, 3);
  if(bajos.length) partes.push("Áreas que requieren más atención: " + bajos.map(b => `${nombreAgente(b.k)} (${b.s}/100)`).join(", ") + ".");
  return partes;
}

function setTodosExcluidos(v){

  render();

function limpiarInforme(){
  if(!confirm("¿Vaciar los ítems del informe del documento activo?")) return;
  state.informeItems = state.informeItems.filter(i => i.document_id !== state.docActivo);
  guardarInforme();

}

function toggleChatEnInforme(msgId){
  const existing = state.informeItems.findIndex(it => it.tipo === "chat" && it.msgId === msgId);
  if(existing >= 0){
    state.informeItems.splice(existing, 1);
  } else {
    const idx = state.mensajes.findIndex(m => m.id === msgId);
    if(idx === -1) return;
    const msg = state.mensajes[idx];
    let pregunta = "";
    for(let i = idx - 1; i >= 0; i--){
      if(state.mensajes[i].rol === "me"){ pregunta = state.mensajes[i].texto; break; }
    }
    state.informeItems.push({
      tipo:"chat", msgId, document_id:state.docActivo, agente:msg.agente,
      agente_key:msg.agente_key || state.agenteActual, pregunta, respuesta:msg.texto,
      fuentes:msg.fuentes || [], excluido:false,
    });
  }
  guardarInforme();
  render();
}

function agregarChatAlInforme(msgId, pregunta){
  const msg = state.mensajes.find(m => m.id === msgId);
  if(!msg || !msg.texto || msg.error) return;
  if(state.informeItems.some(it => it.tipo === "chat" && it.msgId === msgId)) return;
  state.informeItems.push({
    tipo:"chat", msgId, document_id:state.docActivo, agente:msg.agente,
    agente_key:msg.agente_key || state.agenteActual,
    pregunta, respuesta:msg.texto, fuentes:msg.fuentes || [], excluido:false,
  });
  guardarInforme();
}

function agregarTodoAlInforme(){
  if(!state.analisis || !state.docActivo){ toast("No hay análisis para agregar", true); return; }
  let agregados = 0;
  Object.entries(state.analisis.resultados).forEach(([k, r]) => {
    if(!state.informeItems.some(it => it.tipo === "analisis" && it.agente_key === k && it.document_id === state.docActivo)){
      state.informeItems.push({tipo:"analisis", document_id:state.docActivo, agente:nombreAgente(k), agente_key:k, resultado:r, excluido:false});
      agregados++;
    }
  });
  guardarInforme();
  toast(agregados > 0 ? `${agregados} análisis agregados al informe` : "Ya estaban todos en el informe");
  render();
}
function toggleAnalisisEnInforme(k){
  const i = state.informeItems.findIndex(it => it.tipo === "analisis" && it.agente_key === k && it.document_id === state.docActivo);
  if(i >= 0) state.informeItems.splice(i, 1);
