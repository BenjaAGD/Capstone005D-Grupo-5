async function cargarAgentesBackend(){
  try{
    const d = await api("/api/agentes");
    const lista = (d.agentes || []).filter(a => a.tipo !== "general");
    if(!lista.length) return;
    lista.forEach(a => {
      const local = agentByKey(a.clave);
      if(local){ local.ola = a.ola; local.tipo = a.tipo; }
      else AGENTS.push({id:a.clave, key:a.clave, name:String(a.nombre || a.clave).replace(/^Agente\s+/, "").replace(/\s*\(.*\)\s*$/, ""),
                        badge:String(a.clave).slice(0, 3).toUpperCase(), tipo:a.tipo, ola:a.ola, desc:a.descripcion || ""});
    });
    AGENTS.sort((x, y) => x.ola - y.ola);
    state.totalAgentes = AGENTS.length;
  }catch(e){ /* se usan los valores locales */ }
}

async function cargarDocumentos(silencioso){
  try{
    const datos = await api("/api/documentos");
    if(datos.ok === false) throw new Error(datos.error || "el backend no pudo listar los documentos");
    state.backendOk = true;
    state.documentos = datos.documentos || [];
    const ids = new Set(state.documentos.map(d => d.id));
    // Limpia lo guardado de documentos que ya no existen (solo si el listado llegó bien)
    const antes = state.informeItems.length;
    state.informeItems = state.informeItems.filter(i => ids.has(i.document_id));
    if(state.informeItems.length !== antes) guardarInforme();
    if(!state.docActivo || !ids.has(state.docActivo)){
      state.docActivo = state.documentos.length ? state.documentos[0].id : null;
      lsSet(LS.doc, state.docActivo || "");
      state.mensajes = []; state.sugerencias = []; state.analisis = null;
      if(state.docActivo){
        cargarChat(state.docActivo);
        await cargarAnalisisGuardados(state.docActivo);   // antes quedaba sin análisis tras eliminar el activo
      }
    }
  }catch(e){
    console.warn("No se pudieron cargar documentos:", e.message);
    state.backendOk = false;
  }
  vigilarDocumentos();
  if(!silencioso) render();
}

/* Si hay documentos procesándose (p. ej. tras recargar la página), refresca la lista sola */
function vigilarDocumentos(){
  if(state.watchId) return;
  if(!state.documentos.some(d => ESTADOS_PROCESANDO.includes(d.estado))) return;
  const desde = Date.now();
  state.watchId = setInterval(async () => {
    const procesando = () => state.documentos.some(d => ESTADOS_PROCESANDO.includes(d.estado));
    if(state.subiendo) return;
    const activoAntes = state.documentos.find(d => d.id === state.docActivo);
    const enProcesoAntes = activoAntes && ESTADOS_PROCESANDO.includes(activoAntes.estado);
    const firmaAntes = JSON.stringify(state.documentos);
    await cargarDocumentos(true);
    const activoAhora = state.documentos.find(d => d.id === state.docActivo);
    let cambio = firmaAntes !== JSON.stringify(state.documentos);
    if(enProcesoAntes && activoAhora && !ESTADOS_PROCESANDO.includes(activoAhora.estado)){
      await cargarAnalisisGuardados(state.docActivo);
      toast(activoAhora.estado === "Error" ? "El documento terminó con error" : "Documento listo");
      cambio = true;
    }
    if(cambio) render();
    if(!procesando() || Date.now() - desde > 40 * 60 * 1000){ clearInterval(state.watchId); state.watchId = null; }
  }, 4000);
}

async function cargarAnalisisGuardados(documentId){
  if(!documentId) return null;
  state.cargandoAnalisis = true;
  try{
    const d = await api(`/api/analisis-completos/${encodeURIComponent(documentId)}`);
    if(documentId !== state.docActivo) return d;     // el usuario cambió de documento mientras cargaba
    state.analisis = (d.ok && d.analisis && Object.keys(d.analisis).length > 0) ? {resultados:d.analisis} : null;
    return d;
  }catch(e){
    console.warn("No se pudieron cargar análisis:", e);
    if(documentId === state.docActivo) state.analisis = null;
    return null;
  }finally{
    state.cargandoAnalisis = false;
  }
}

async function cambiarDocumento(id){
  if(state.consultando){ toast("Espera a que termine la respuesta en curso", true); return false; }
  if(id === state.docActivo) return true;
  guardarChat();
  state.docActivo = id;
  lsSet(LS.doc, id);
  state.sugerencias = []; state.tabActivaChat = {}; state.analisis = null; state.borrador = "";
  state.filtroSev = "todas"; state.filtroAgente = "todos"; state.abiertos = new Set();
  cargarChat(id);
  render();
  await cargarAnalisisGuardados(id);
  render();
  return true;
}

async function subirArchivo(file){
  if(!file) return;
  if(state.subiendo){ toast("Ya hay una subida en curso", true); return; }
  const ext = file.name.toLowerCase().split(".").pop();
  if(!["pdf", "docx", "doc", "xlsx", "xls"].includes(ext)){ toast("Solo se aceptan PDF, Word o Excel", true); return; }

  const document_id = newId();
  state.subiendo = true;
  state.subiendoNombre = file.name;
  state.progreso = {estado:"Iniciando", fase:"iniciando", procesados:0, total:0, estimado_seg:0, errores:0};
  render();

  const fd = new FormData();
  fd.append("archivo", file);
  fd.append("document_id", document_id);

  const terminarSubida = () => {
    clearInterval(state.pollingId); state.pollingId = null;
    state.subiendo = false; state.progreso = null;
  };

  state.pollingId = setInterval(async () => {
    try{
      const d = await api(`/api/progreso/${document_id}`);
      if(d && d.estado && d.estado !== "No encontrado"){
        state.progreso = d;
        renderProgresoSubida();
        if(d.estado === "Listo" || d.estado === "Listo con errores" || d.estado === "Error"){
          terminarSubida();
          if(d.estado === "Error"){
            toast("Error procesando el documento", true);
            await cargarDocumentos();
          } else {
            toast(d.estado === "Listo" ? "Documento listo y analizado" : "Documento listo, pero con errores: revisa qué agentes faltan", d.estado !== "Listo");
            guardarChat();
            state.docActivo = document_id; lsSet(LS.doc, document_id);
            state.mensajes = []; state.sugerencias = []; state.sugerenciasCache = {};
            state.tabActivaChat = {}; state.analisis = null; state.borrador = "";
            await cargarDocumentos(true);
            await cargarAnalisisGuardados(document_id);
            render();
          }
        }
      }
    }catch(e){ /* un fallo puntual de red no corta la subida */ }
  }, 1500);

  try{
    const datos = await api("/api/subir-informe/", {method:"POST", body:fd});
    if(!datos.ok){ terminarSubida(); toast("Error al procesar: " + (datos.error || "desconocido"), true); render(); }
  }catch(e){
    terminarSubida();
    toast("Error de conexión con el backend", true);
    render();
  }
}

async function eliminarDocumento(id){
  if(!confirm("¿Eliminar este documento, sus fragmentos y sus análisis?")) return;
  try{
    const datos = await api(`/api/documentos/${encodeURIComponent(id)}`, {method:"DELETE"});
    if(!datos.ok){ toast("Error al eliminar", true); return; }
    toast("Documento eliminado");
    state.informeItems = state.informeItems.filter(i => i.document_id !== id);
    guardarInforme();
    const todos = lsGetJSON(LS.chats, {}); delete todos[id]; lsSetJSON(LS.chats, todos);
    Object.keys(state.sugerenciasCache).forEach(k => { if(k.startsWith(id + "::")) delete state.sugerenciasCache[k]; });
    if(state.docActivo === id){ state.docActivo = null; state.analisis = null; state.mensajes = []; state.sugerencias = []; }
    await cargarDocumentos();   // elige otro documento y carga su análisis
  }catch(e){ toast("Error de conexión", true); }
}

async function activarDocumento(id){
  const ok = await cambiarDocumento(id);
  if(ok) toast("Documento activado");
}
async function irAChat(id){
  if(!(await cambiarDocumento(id))) return;
  go("chat");
  cargarSugerencias();
}
async function irAResultados(id){
  if(!(await cambiarDocumento(id))) return;
  go("resultados");
}

async function cargarSugerencias(){
  if(!state.docActivo) return;
  const cacheKey = `${state.docActivo}::${state.agenteActual}`;
  if(state.sugerenciasCache[cacheKey]){ state.sugerencias = state.sugerenciasCache[cacheKey]; render(); return; }
  if(state.cargandoSugerencias) return;
  const doc = state.docActivo, agente = state.agenteActual;
  state.cargandoSugerencias = true;
  render();
  try{
    const fd = new FormData();
    fd.append("document_id", doc);
    fd.append("agente", agente);
    const datos = await api("/api/sugerencias/", {method:"POST", body:fd});
    if(datos.ok){
      state.sugerenciasCache[`${doc}::${agente}`] = datos.sugerencias || [];
      if(doc === state.docActivo && agente === state.agenteActual) state.sugerencias = datos.sugerencias || [];
    }
  }catch(e){ console.warn("Error cargando sugerencias:", e); }
  state.cargandoSugerencias = false;
  render();
}

/* ------------------------------- chat: envío ------------------------------- */
function historialParaBackend(){
  const turnos = [];
  for(let i = 0; i < state.mensajes.length - 1; i++){
    const a = state.mensajes[i], b = state.mensajes[i + 1];
    if(a.rol === "me" && b.rol === "ai" && !b.streaming && !b.error && b.texto) turnos.push({pregunta:a.texto, respuesta:b.texto});
  }
  return JSON.stringify(turnos.slice(-4));
}

async function enviarPregunta(){
  const input = document.getElementById("chatInput");
  const pregunta = (input ? input.value : state.borrador).trim();
  if(!pregunta || state.consultando) return;
  if(!state.docActivo){ toast("Selecciona un documento activo", true); return; }

  const historial = historialParaBackend();     // se calcula antes de agregar la pregunta nueva
  state.mensajes.push({id:uid(), rol:"me", texto:pregunta});
  const ag = agentByKey(state.agenteActual);
  const msg = {
    id:uid(), rol:"ai", texto:"", fuentes:[],
    agente: state.agenteActual === "general" ? "Asistente General" : (ag?.name || "Asistente"),
    agente_key: state.agenteActual, streaming:true, error:false,
  };
  state.mensajes.push(msg);
  state.tabActivaChat[msg.id] = "respuesta";
  state.consultando = true;
  state.borrador = "";
  state._chatAlFondo = true;
  render();

  const fd = new FormData();
  fd.append("pregunta", pregunta);
  fd.append("document_id", state.docActivo);
  fd.append("agente", state.agenteActual);
  fd.append("historial", historial);

  const fallar = txt => { msg.error = true; msg.texto = txt; };
  try{
    const r = await fetch(`${API}/api/consultar-stream/`, {method:"POST", body:fd});
    if(!r.ok || !r.body){
      const datos = await api("/api/consultar/", {method:"POST", body:fd});
      if(datos.ok){ msg.texto = datos.respuesta; msg.fuentes = datos.fuentes || []; }
      else fallar("No se pudo obtener respuesta: " + (datos.error || "error desconocido"));
    } else {
      const reader = r.body.getReader(), decoder = new TextDecoder();
      let buffer = "", acumulado = "", errorServidor = "";
      const procesar = line => {
        const t = line.trim();
        if(!t.startsWith("data:")) return;
        const payload = t.slice(5).trim();
        if(payload === "[DONE]") return;
        try{
          const p = JSON.parse(payload);
          if(p.error) errorServidor = String(p.error);
          if(p.chunk){
            acumulado += p.chunk;
            msg.texto = acumulado;
            const el = document.getElementById(`txt_${msg.id}`);
            if(el){ el.textContent = acumulado; }
            const body = document.getElementById("chatBody");
            if(body) body.scrollTop = body.scrollHeight;
          }
          if(p.fuentes) msg.fuentes = p.fuentes;
          if(p.agente) msg.agente = p.agente;
        }catch(e){}
      };
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, {stream:true});
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        lines.forEach(procesar);
      }
      if(buffer) procesar(buffer);
      if(!acumulado && errorServidor) fallar("No se pudo obtener respuesta: " + errorServidor);
      else if(!acumulado) fallar("El agente no devolvió texto. Intenta de nuevo.");
      else msg.texto = acumulado;
    }
  }catch(e){
    console.warn("Error de chat:", e);
    if(!msg.texto) fallar("Error de conexión con el backend.");
  }
  msg.streaming = false;
  state.consultando = false;
  if(!msg.error) agregarChatAlInforme(msg.id, pregunta);
  guardarChat();
  state._chatAlFondo = true;
  render();
}

/* ------------------------------- informe PDF ------------------------------- */
async function descargarPDF(){
  const activos = itemsInforme().filter(i => !i.excluido);
  if(activos.length === 0){ toast("No hay ítems seleccionados", true); return; }
  state.generandoPDF = true;
  render();
  const docActivo = state.documentos.find(d => d.id === state.docActivo);
  const payload = {
    documento: {nombre: docActivo?.titulo || docActivo?.nombre_archivo || "Documento", paginas: docActivo?.total_paginas || "?"},
    items: activos.map(it => it.tipo === "chat"
      ? {tipo:"chat", agente:it.agente, agente_key:it.agente_key, pregunta:it.pregunta, respuesta:it.respuesta, fuentes:it.fuentes}
      : {tipo:"analisis", agente:it.agente, agente_key:it.agente_key, resultado:it.resultado}),
  };
  try{
    toast("Generando informe…");
    const fd = new FormData();
    fd.append("document_id", state.docActivo || "");
    fd.append("payload", JSON.stringify(payload));
    const r = await fetch(`${API}/api/informe/`, {method:"POST", body:fd});
    if(!r.ok){ toast("Error generando el informe (HTTP " + r.status + ")", true); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Directa_Informe_${new Date().toISOString().slice(0, 10)}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("PDF descargado");
  }catch(e){
    console.error(e);
    toast("Error generando PDF: " + e.message, true);
  }finally{
    state.generandoPDF = false;
    render();
  }
}

/* ==========================================================================
   RENDER (conserva texto, foco y posición de scroll)
   ========================================================================== */
/* ---- Módulos (Dashboard y Memoria Anual): viven en sus propios archivos y se muestran aquí dentro,
   con el mismo menú lateral. No usan IA: solo leen lo ya guardado. ---- */
function urlModulo(archivo){
  const q = new URLSearchParams({
    embed: "1", api: API,
    theme: document.documentElement.getAttribute("data-theme") || "dark",
    font: lsGet(LS.font, "1"),
  });
  if(state.docActivo) q.set("doc", state.docActivo);
  return `${API}/${archivo}?${q.toString()}`;
}
function vModulo(){
  const n = NAV.find(x => x.id === state.view);
  return `<iframe id="modFrame" class="mod-frame" title="${esc(n.l)}" src="${esc(urlModulo(n.modulo))}"></iframe>`;
}
function vModuloCaido(){
  const n = NAV.find(x => x.id === state.view);
  return `<div class="view-pad"><div class="card"><h2 style="margin:0 0 6px">${esc(n.l)}</h2>
    <p class="muted">No hay conexión con el servidor, y esta sección lee los datos desde ahí. Enciende el backend y vuelve a entrar.</p>
    <button class="btn" onclick="go('${esc(n.id)}')">Reintentar</button></div></div>`;
}
function enviarPrefsModulo(){
  const f = document.getElementById("modFrame");
  if(!f || !f.contentWindow) return;
  f.contentWindow.postMessage({directa: "prefs", theme: document.documentElement.getAttribute("data-theme"), font: parseFloat(lsGet(LS.font, "1")) || 1}, "*");
}
window.addEventListener("message", ev => {
  const f = document.getElementById("modFrame");
  if(!f || ev.source !== f.contentWindow) return;
  const d = ev.data;
  if(d && d.directa === "doc" && state.documentos.some(x => String(x.id) === d.id)){
    const doc = state.documentos.find(x => String(x.id) === d.id);
    state.docActivo = doc.id; lsSet(LS.doc, String(doc.id));
  }
});

const VIEWS = {
  inicio: vInicio, docs: vDocs, chat: vChat, resultados: vResultados, informe: vInforme,
  dashboard: vModulo, memoria: vModulo,
};

function capturarUI(){
  const ci = document.getElementById("chatInput");
  const cont = document.querySelector(".content");
  const cb = document.getElementById("chatBody");
  return {
    foco: ci && document.activeElement === ci ? {s:ci.selectionStart, e:ci.selectionEnd} : null,
    contenido: cont ? cont.scrollTop : 0,
    chat: cb ? cb.scrollTop : 0,
    chatAlFondo: cb ? (cb.scrollHeight - cb.scrollTop - cb.clientHeight < 80) : true,
    paneles: [...document.querySelectorAll(".informe-panel-body")].map(p => p.scrollTop),
  };
}
function restaurarUI(u){
  const cont = document.querySelector(".content");
  if(cont) cont.scrollTop = state._resetScroll ? 0 : u.contenido;
  const cb = document.getElementById("chatBody");
  if(cb){
    if(state._resetScroll || state._chatAlFondo || u.chatAlFondo) cb.scrollTop = cb.scrollHeight;
    else cb.scrollTop = u.chat;
  }
  if(!state._resetScroll) document.querySelectorAll(".informe-panel-body").forEach((p, i) => { if(u.paneles[i] != null) p.scrollTop = u.paneles[i]; });
  const ci = document.getElementById("chatInput");
  if(ci){
    autoTamano(ci);
    if(u.foco){ ci.focus({preventScroll:true}); try{ ci.setSelectionRange(u.foco.s, u.foco.e); }catch(e){} }
  }
  state._resetScroll = false;
  state._chatAlFondo = false;
}

function render(){
  const ui = capturarUI();
  const navHtml = [];
  NAV.forEach(n => {
    if(n.__sep){ navHtml.push(`<div class="nav-label">${esc(n.__sep)}</div>`); return; }
    let badge = "";
    if(n.soon) badge = `<span class="badge soon">Pronto</span>`;
    else if(n.badge){ const b = n.badge(); if(b) badge = `<span class="badge count">${esc(b)}</span>`; }
    navHtml.push(`<button class="nav-item ${state.view === n.id ? "active" : ""}" ${state.view === n.id ? 'aria-current="page"' : ""} onclick="go(${arg(n.id)})" data-tip="${esc(n.tip || "")}">${n.ic}<span>${n.l}</span>${badge}</button>`);
  });
  $("#nav").innerHTML = navHtml.join("");

  const cur = NAV.find(n => n.id === state.view);
  $("#crumbs").innerHTML = `DIRECTA › <b>${esc(cur ? cur.crumb : "")}</b>`;

  const vista = $("#view");
  const esModulo = !!(cur && cur.modulo);
  $(".content").classList.toggle("flush", esModulo);
  if(esModulo){
    // el iframe se arma una sola vez por visita: re-renderizar el panel no debe recargarlo
    const clave = state.view + (state.backendOk ? ":ok" : ":off");
    if(vista.dataset.mod !== clave){
      vista.dataset.mod = clave;
      vista.innerHTML = state.backendOk ? vModulo() : vModuloCaido();
    }
  } else {
    vista.dataset.mod = "";
    vista.innerHTML = (VIEWS[state.view] || vInicio)();
  }
  if(state._resetScroll){ vista.classList.remove("anim"); void vista.offsetWidth; vista.classList.add("anim"); }   // la animación solo al cambiar de vista

  hideTip();
  bindTooltips();
  restaurarUI(ui);
}

/* ==========================================================================
   TOOLTIPS (también con teclado) y etiquetas accesibles
   ========================================================================== */
let tipEl = null, tipTimer = null, tipTarget = null;
function ensureTip(){
  if(tipEl) return tipEl;
  tipEl = document.createElement("div");
  tipEl.className = "matrix-tip";
  tipEl.setAttribute("role", "tooltip");
  tipEl.innerHTML = `<b></b><span></span>`;
  document.body.appendChild(tipEl);
  return tipEl;
}
function showTip(t){
  const raw = t.getAttribute("data-tip");
  if(!raw || !document.body.contains(t)) return;
  const [title, ...rest] = raw.split("::");
  const body = rest.join("::").trim();
  const el = ensureTip();
  el.querySelector("b").textContent = title.trim();
  el.querySelector("b").style.display = title.trim() ? "block" : "none";
  el.querySelector("span").textContent = body;
  el.classList.add("on");
  const r = t.getBoundingClientRect(), e = el.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight;
  let x = r.left + r.width / 2 - e.width / 2;
  let y = r.top - e.height - 10;
  if(y < 8) y = r.bottom + 10;
  if(x < 8) x = 8;
  if(x + e.width > vw - 8) x = vw - e.width - 8;
  if(y + e.height > vh - 8) y = vh - e.height - 8;
  el.style.left = x + "px";
  el.style.top = y + "px";
}
function hideTip(){ if(tipEl) tipEl.classList.remove("on"); tipTarget = null; clearTimeout(tipTimer); }
function bindTooltips(){
  document.querySelectorAll("[data-tip]").forEach(el => {
    if(el.__tipB) return;
    el.__tipB = true;
    const [title, ...rest] = el.getAttribute("data-tip").split("::");
    if(!el.getAttribute("aria-label") && !el.textContent.trim()) el.setAttribute("aria-label", title.trim() + (rest.length ? ". " + rest.join("::").trim() : ""));
    const mostrar = () => { clearTimeout(tipTimer); tipTarget = el; tipTimer = setTimeout(() => { if(tipTarget === el) showTip(el); }, 250); };
    el.addEventListener("mouseenter", mostrar);
    el.addEventListener("focus", mostrar);
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("blur", hideTip);
    el.addEventListener("click", hideTip);
  });
}
window.addEventListener("scroll", hideTip, true);

/* ==========================================================================
   INICIO
   ========================================================================== */
async function init(){
  await cargarAgentesBackend();
  if(state.docActivo) cargarChat(state.docActivo);
  await cargarDocumentos(true);      // elige/valida el documento activo y carga su análisis
  if(state.docActivo && !state.analisis && state.backendOk) await cargarAnalisisGuardados(state.docActivo);
  render();
}
init();

</script>
